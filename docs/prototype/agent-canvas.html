<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agent Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar fina | canvas amplo | inspetor flutuante + toolbar flutuante. Tema claro proposital (único). */
:root{
  color-scheme:light;
  --bg:#f2f2f4; --dot:#d6d6db; --surface:#ffffff; --subtle:#f7f7f8; --hover:#f0f0f2;
  --fg:#1d1d1f; --muted:#6e6e73; --faint:#a1a1a6; --line:#e6e6e9; --line-strong:#d2d2d7;
  --accent:#0a6cf0; --accent-soft:#e9f1fe;
  --issue:#e2560b; --issue-soft:#fff0e5; --mr:#7a4ce0; --mr-soft:#f1ecfd; --repo:#0e7a6b; --repo-soft:#e2f4f0;
  --ok:#0c7a43; --ok-soft:#dbf6e6; --warn:#8a5a00; --warn-soft:#fff3c4; --bad:#c4291c; --bad-soft:#fde7e5;
  --edge:#c3c3c9;
  --note:#9a6b00; --note-soft:#fff3c8; --note-bg:#fffcf2; --note-line:#e9c46a;
  --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sh-card:0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04),0 8px 24px -10px rgba(0,0,0,.12);
  --sh-float:0 0 0 1px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04),0 18px 48px -16px rgba(0,0,0,.24);
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --track:-0.04em;
  /* motion */
  --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
}
@supports (corner-shape: squircle){
  :root{--r-xs:9px; --r-sm:14px; --r-md:20px; --r-lg:26px; --r-xl:32px}
  .btn,.field,.card,.seg,.seg-ind,.badge,.insp,.side,.toolbar,.toast,.focus-sheet,.ico,.iss,.iss-ic,.composer,.f-comp,.l.ask,.l.user,.plan,.chipx,.ctx-add,pre.cmd,.appicon,.tree button,.opt,.opts,.links .lk,
  .callout,.stat,.fx-note,.diff,.lst-item,.cpop,.cp-it,.cmenu,.tb-grp,.act-card,.rules,.chip-s{corner-shape:squircle}
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);letter-spacing:var(--track);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}

.app{position:relative;height:100%}
.top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:10px 14px;padding:12px 16px;background:transparent;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.top>.spacer{pointer-events:none}
.brand{display:flex;align-items:center;gap:10px}
.appicon{width:28px;height:28px;border-radius:var(--r-sm);background:linear-gradient(160deg,#2c2c2e,#000);display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.brand b{font-weight:600;font-size:15px}
.brand .ws{color:var(--muted);font-size:13px}
.spacer{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 12px;border-radius:var(--r-sm);border:0;background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -1px 0 rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.03);
  transition:transform 160ms var(--ease-out),background-color 150ms ease,opacity 150ms ease}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn.primary{background:#1d1d1f;background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px #111,0 1px 2px rgba(0,0,0,.25)}
.btn.plain{box-shadow:none;background:transparent}
.btn.sm{font-size:12px;padding:5px 10px}
.btn.icon{padding:6px;width:30px;height:30px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mob{display:none}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:var(--r-xs);background:var(--hover);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;transition:background-color 200ms ease,color 200ms ease}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.issue{background:var(--issue-soft);color:var(--issue)}
.badge.mrb{background:var(--mr-soft);color:var(--mr)}
.badge.repo{background:var(--repo-soft);color:var(--repo);font-family:var(--mono);font-size:10.5px}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.live .d{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.main{position:absolute;inset:0}
/* barra lateral: mesmo cartão flutuante do inspetor */
.side{position:absolute;top:60px;left:12px;bottom:12px;width:296px;z-index:5;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-float);display:flex;flex-direction:column;min-height:0;overflow:hidden;transform-origin:0 50%;
  transition:opacity 200ms var(--ease-out),transform 260ms var(--ease-out),visibility 0s}
.main.side-hidden .side{opacity:0;transform:translateX(-16px) scale(0.98);visibility:hidden;pointer-events:none;
  transition:opacity 180ms var(--ease-out),transform 240ms var(--ease-out),visibility 0s linear 240ms}
.main.instant .side{transition:none}
.side-h{padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--hover);border-radius:var(--r-sm);padding:2px}
.seg-ind{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / 4);border-radius:calc(var(--r-sm) - 2px);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06);transition:transform 220ms var(--ease-out)}
.seg button{position:relative;border:0;background:transparent;padding:5px 0;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:color 150ms ease}
.seg button[aria-selected="true"]{color:var(--fg)}
.field{width:100%;padding:8px 10px;border-radius:var(--r-sm);border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong);outline:0}
.field:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-soft)}
.field.search{background:var(--hover);box-shadow:none}
textarea.field{resize:vertical;min-height:72px;line-height:1.45}
select.field{appearance:auto}
.side-b{overflow:auto;padding:0 8px 12px;min-height:0;flex:1}
.lst-item{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:var(--r-md);cursor:grab;transition:background-color 150ms ease}
.lst-item .r1{display:flex;align-items:center;gap:6px}
.lst-item .t{font-size:13.5px;line-height:1.35;font-weight:450}
.lst-item.on .t{color:var(--muted)}
.lst-item .r1 .btn{margin-left:auto}
.num{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tip{font-size:12px;color:var(--faint);padding:6px 10px 0;line-height:1.45}
.feed{display:flex;flex-direction:column;gap:12px;padding:6px 6px}
.feed .row{display:grid;grid-template-columns:40px 1fr;gap:6px;font-size:12.5px;line-height:1.45}
.feed time{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:1px}

/* canvas */
.canvas{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);cursor:grab;touch-action:none;min-width:0}
.canvas.panning{cursor:grabbing}
.canvas.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.spawn{stroke-dasharray:5 5}
.edge.mrk{stroke:#c9b6f3}
.edge.live{stroke:var(--accent);stroke-dasharray:5 5;animation:flow .9s linear infinite}
.edge.note{stroke:var(--note-line);stroke-dasharray:1 5;stroke-linecap:round;stroke-width:2.4}
.canvas.linking{cursor:crosshair}
.node.linkt>.card{box-shadow:0 0 0 2px var(--note-line),0 0 0 7px var(--note-soft)}
.note{width:270px;background:var(--note-bg);cursor:default;position:relative;gap:6px;box-shadow:0 0 0 1px rgba(154,107,0,.16),0 1px 2px rgba(0,0,0,.04),0 8px 24px -10px rgba(120,80,0,.18)}
.note .nhead{cursor:grab}
.ico.note{background:var(--note-soft);color:var(--note)}
.note .ntitle-in{border:0;background:transparent;font-size:14.5px;font-weight:600;padding:2px 0;outline:0;width:100%}
.note .nbody{border:0;background:transparent;resize:none;font-size:13px;line-height:1.5;color:#3a3a3c;outline:0;width:100%;min-height:96px;padding:0;font-family:var(--sans)}
.note .ntitle-in:focus,.note .nbody:focus{background:rgba(255,255,255,.7);box-shadow:0 0 0 4px rgba(255,255,255,.7);border-radius:4px}
.port{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:0;background:var(--surface);color:var(--note);font-size:16px;line-height:1;cursor:crosshair;box-shadow:0 0 0 1.5px var(--note-line),0 2px 6px rgba(0,0,0,.12);display:grid;place-items:center}
.links{display:flex;flex-direction:column;gap:4px}
.links .lk{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:var(--r-sm);background:var(--subtle);font-size:12.5px}
.links .lk .btn{margin-left:auto}
@keyframes flow{to{stroke-dashoffset:-20}}

.toolbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:4}
.tb-grp{display:flex;align-items:center;gap:2px;padding:4px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r-md);box-shadow:var(--sh-float)}
.tb-grp .btn svg{flex:none}
.toolbar output{font-family:var(--mono);font-size:11.5px;min-width:46px;text-align:center;color:var(--muted)}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}

/* nós */
.node{position:absolute;user-select:none;transform-origin:50% 0}
.node.dragging{z-index:3}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);transition:box-shadow 180ms var(--ease-out)}
.node.dragging>.card{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 24px 48px -16px rgba(0,0,0,.28)}
.node.sel.dragging>.card{box-shadow:0 0 0 2px var(--accent),0 24px 48px -16px rgba(10,108,240,.4)}
.node.sel>.card{box-shadow:0 0 0 2px var(--accent),0 8px 24px -10px rgba(10,108,240,.35)}
.node.dropt>.card{box-shadow:0 0 0 2px var(--accent),0 0 0 6px var(--accent-soft)}
.ncard{width:284px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:grab}
.nhead{display:flex;align-items:center;gap:8px}
.ico{width:26px;height:26px;border-radius:var(--r-xs);display:grid;place-items:center;flex:none}
.ico.issue{background:var(--issue-soft);color:var(--issue)}
.ico.mr{background:var(--mr-soft);color:var(--mr)}
.ico.repo{background:var(--repo-soft);color:var(--repo)}
.ico.agent{background:var(--accent-soft);color:var(--accent)}
.ntitle{font-size:14.5px;font-weight:600;line-height:1.35;text-wrap:balance}
.nfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nmeta{font-size:12px;color:var(--muted)}
.diffstat{font-family:var(--mono);font-size:11.5px}
.diffstat .a{color:var(--ok)} .diffstat .r{color:var(--bad)}

.win{width:400px;overflow:hidden}
.wbar{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:grab;border-bottom:1px solid var(--line)}
.lights{display:flex;gap:5px;margin-right:2px}
.lights i{width:10px;height:10px;border-radius:50%;background:#e3e3e6;display:block}
.lights i{transition:background-color 150ms ease}
.wbar .expand{margin-left:2px}
.wname{font-weight:600;font-size:13px;}
.wsub{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win.orch .wbar{background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.tbody{height:230px;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#3a3a3c;user-select:text;cursor:text;overscroll-behavior:contain;background:var(--surface)}
.l{white-space:pre-wrap;word-break:break-word;transition:opacity 180ms var(--ease-out),translate 180ms var(--ease-out)}
@starting-style{.l{opacity:0;translate:0 4px}}
.l.sys{color:var(--fg);font-weight:500}
.l.dim,.l.out{color:var(--faint)}
.l.tool .g{color:var(--ok)}
.l.tool b{font-weight:600;color:var(--fg)}
.l.txt{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--fg);margin:3px 0}
.l.txt .g{color:var(--faint);font-family:var(--mono);font-size:10px;vertical-align:1px}
.l.add{background:var(--ok-soft);color:var(--ok);padding:0 6px;border-radius:4px}
.l.del{background:var(--bad-soft);color:var(--bad);padding:0 6px;border-radius:4px}
.l.user{font-family:var(--sans);font-size:13px;margin:6px 0 6px auto;background:var(--hover);padding:6px 10px;border-radius:var(--r-md);width:fit-content;max-width:85%;color:var(--fg)}
.l.user small{display:block;color:var(--muted);font-size:11px}
.l.done{font-family:var(--sans);font-size:13px;color:var(--ok);font-weight:500;margin-top:4px}
.l.ask{font-family:var(--sans);font-size:13px;background:var(--warn-soft);color:#5c3d00;border-radius:var(--r-md);padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.l.ask code{font-family:var(--mono);font-size:11.5px}
.l.ask .acts{display:flex;gap:6px}
.plan{font-family:var(--sans);font-size:12.5px;background:var(--subtle);border-radius:var(--r-md);padding:10px 12px;margin:6px 0;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.plan b{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:600}
.plan .it{display:flex;align-items:center;gap:8px}
.plan .ck{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong);flex:none;display:grid;place-items:center;font-size:10px;color:#fff;transition:background-color 200ms ease,box-shadow 200ms ease}
.plan .tx{transition:color 200ms ease}
.plan .it.wip .ck{box-shadow:inset 0 0 0 1.5px var(--accent);background:radial-gradient(var(--accent) 35%,transparent 40%)}
.plan .it.ok .ck{background:var(--ok);box-shadow:none}
.plan .it.ok .tx{color:var(--muted)}
.plan .who{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.composer{display:flex;align-items:center;gap:6px;margin:0 10px 10px;padding:4px 4px 4px 12px;border-radius:var(--r-md);background:var(--subtle);box-shadow:inset 0 0 0 1px var(--line)}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;padding:5px 0}
.composer input::placeholder{color:var(--faint)}
.composer .send{width:26px;height:26px;border-radius:50%;border:0;background:var(--fg);color:#fff;display:grid;place-items:center;cursor:pointer}
.composer .send:disabled{background:var(--line-strong)}

/* inspetor flutuante */
.insp{position:absolute;top:60px;right:12px;bottom:12px;width:372px;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-float);display:flex;flex-direction:column;z-index:5;overflow:hidden;
  opacity:0;transform:translateX(16px) scale(0.98);transform-origin:100% 50%;visibility:hidden;pointer-events:none;
  transition:opacity 180ms var(--ease-out),transform 240ms var(--ease-out),visibility 0s linear 240ms}
.insp.open{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity 200ms var(--ease-out),transform 260ms var(--ease-out),visibility 0s}
.btn.danger{color:var(--bad)}

/* aviso com desfazer */
.toast{position:absolute;left:50%;bottom:24px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:var(--r-lg);background:#1d1d1f;color:#fff;font-size:13px;box-shadow:0 12px 32px -10px rgba(0,0,0,.45);z-index:8;
  opacity:0;transform:translate(-50%,10px) scale(0.98);visibility:hidden;pointer-events:none;
  transition:opacity 180ms var(--ease-out),transform 220ms var(--ease-out),visibility 0s linear 220ms}
.toast.show{opacity:1;transform:translate(-50%,0);visibility:visible;pointer-events:auto;transition:opacity 200ms var(--ease-out),transform 240ms var(--ease-out),visibility 0s}
.toast .btn{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.toast kbd{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.55)}

/* barra lateral */
.search-w{position:relative}
.search-w svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search-w .field{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--muted);cursor:pointer;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.chip:active{transform:scale(0.97)}
.chip[aria-pressed="true"]{background:var(--fg);color:#fff;box-shadow:none}
.grp-h{display:flex;align-items:center;gap:6px;padding:14px 10px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.grp-h:first-child{padding-top:4px}
.cnt{font-variant-numeric:tabular-nums;background:var(--hover);border-radius:999px;padding:0 7px;font-size:11px;font-weight:500;line-height:18px}
.iss{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border-radius:var(--r-md);cursor:grab;transition:background-color 150ms ease}
.iss-ic{width:26px;height:26px;border-radius:var(--r-xs);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.iss-ic.bug{background:var(--issue-soft);color:var(--issue)}
.iss-ic.repo{background:var(--repo-soft);color:var(--repo)}
.iss-t{font-size:13.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iss-t.mono-t{font-family:var(--mono);font-size:12.5px}
.iss-m{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.iss-m .badge{font-size:10.5px;padding:0 6px}
.iss-repo{overflow:hidden;text-overflow:ellipsis}
.iss-r{display:flex;align-items:center;gap:4px;min-height:26px}
.btn.xs{width:26px;height:26px;padding:0;justify-content:center}
.tip{display:flex;gap:8px;align-items:flex-start}
.tip svg{flex:none;margin-top:2px}
.side-f{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px}
.side-f .lab{font-size:12px}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.empty-term{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--muted);display:flex;flex-direction:column;gap:10px;padding:4px 0}
.empty-term b{color:var(--fg);font-weight:600;font-size:14px}
.empty-term ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tl{list-style:none;margin:0;padding:4px 8px 4px 10px;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:3.5px;top:14px;bottom:0;width:1.5px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);margin-top:5px}
.tl li:first-child .tl-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl p{margin:0;font-size:12.5px;line-height:1.45}
.tl time{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* visões de documento no foco */
.f-ico{display:flex}
.f-body.doc{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--fg);padding:28px 32px 36px}
.f-body.note-doc{background:var(--note-bg)}
.fx{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.fx-head{display:flex;flex-direction:column;gap:10px}
.fx-title{font-size:24px;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.fx-meta{margin:0;color:var(--muted);font-size:13px}
.fx section{display:flex;flex-direction:column;gap:10px}
.fx h4{font-size:12px;font-weight:600;color:var(--muted);margin:0}
.fx-p{margin:0;font-size:14.5px;line-height:1.65;color:#3a3a3c;max-width:68ch}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.checklist .ck{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong);flex:none;display:grid;place-items:center;color:#fff;font-size:11px;transition:background-color 200ms ease}
.checklist li.ok .ck{background:var(--ok);box-shadow:none}
.fx-notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fx-note{text-align:left;border:0;background:var(--note-bg);box-shadow:inset 0 0 0 1px rgba(154,107,0,.18);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform 160ms var(--ease-out)}
.fx-note:active{transform:scale(0.98)}
.fx-note b{font-size:13.5px;font-weight:600}
.fx-note span{font-size:12.5px;color:var(--muted)}
.thread{display:flex;flex-direction:column;gap:16px}
.cm{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.av.bot{background:var(--accent-soft);color:var(--accent)}
.cm-h{display:flex;gap:8px;align-items:center;font-size:13px}
.cm-h time{font-size:12px;color:var(--faint)}
.cm p{margin:3px 0 0;font-size:14px;line-height:1.55;color:#3a3a3c}
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stage{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--hover);color:var(--muted)}
.stage.ok{background:var(--ok-soft);color:var(--ok)}
.stage.run{background:var(--accent-soft);color:var(--accent)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
.pipe .ln{width:18px;height:1.5px;background:var(--line-strong)}
.diff{border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.diff-h{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--subtle);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.diff-b{overflow-x:auto;padding:6px 0;font-family:var(--mono);font-size:12px;line-height:1.7}
.dl{padding:0 14px;white-space:pre;min-width:max-content}
.dl.add{background:var(--ok-soft);color:var(--ok)}
.dl.del{background:var(--bad-soft);color:var(--bad)}
.dl.ctx{color:var(--muted)}
.dl.hunk{color:var(--accent);background:var(--accent-soft)}
.note-ed{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.note-ed input{border:0;outline:0;background:transparent;font-size:26px;font-weight:600;padding:0}
.note-ed textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font-size:15.5px;line-height:1.75;min-height:360px;padding:0;color:#3a3a3c}

/* modo foco do agente */
.focus{position:absolute;inset:0;z-index:4;visibility:hidden;pointer-events:none}
.focus.open{visibility:visible;pointer-events:auto}
.focus-bg{position:absolute;inset:0;background:rgba(242,242,244,.32);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity 220ms var(--ease-out)}
.focus.open .focus-bg{opacity:1}
.focus-sheet{position:absolute;top:60px;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-float);overflow:hidden;transform-origin:0 0}
.f-main{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}
.f-head{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 18px;border-bottom:1px solid var(--line)}
.f-head .wname{font-size:16px}
.f-head .wsub{font-size:13px}
.f-body{flex:1;min-height:0;overflow:auto;padding:20px 28px 12px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#3a3a3c;overscroll-behavior:contain}
.f-body .l.txt,.f-body .l.user,.f-body .l.done,.f-body .l.ask{font-size:14.5px;max-width:72ch}
.f-body .l.user{max-width:60%}
.f-foot{padding:10px 20px 18px;display:flex;flex-direction:column;gap:10px}
.f-sugg{display:flex;gap:6px;flex-wrap:wrap}
.f-sugg button{border:0;font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--hover);color:var(--fg);cursor:pointer;transition:background-color 150ms ease,transform 160ms var(--ease-out)}
.f-sugg button:active{transform:scale(0.97)}
.f-comp{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong),0 2px 8px -4px rgba(0,0,0,.08)}
.f-comp:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
.f-comp textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font-size:14.5px;line-height:1.5;padding:6px 0;max-height:160px}
.f-comp .send{width:34px;height:34px;border-radius:50%;border:0;background:var(--fg);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform 160ms var(--ease-out),opacity 150ms ease}
.f-comp .send:active{transform:scale(0.94)}
.f-hint{font-size:11.5px;color:var(--faint);text-align:right}
.insp-top{display:flex;align-items:center;gap:8px;padding:12px 12px 0 18px}
.insp-top .k{font-size:12px;color:var(--muted);font-weight:500}
.insp-top .btn{margin-left:auto}
.insp-body{overflow:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:20px}
.insp h3{font-size:19px;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.insp h4{font-size:12px;font-weight:600;color:var(--muted);margin:0}
.grp{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.desc{font-size:13.5px;line-height:1.55;margin:0;color:#3a3a3c}
.opts{display:flex;flex-direction:column;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;font-size:13px;cursor:pointer;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt small{margin-left:auto;color:var(--faint);font-size:11.5px}
.opt input{accent-color:var(--fg);width:15px;height:15px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lab{font-size:12.5px;color:var(--muted)}
.chipx{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px 4px 9px;border-radius:var(--r-sm);background:var(--hover);max-width:100%}
.chipx svg{width:12px;height:12px;flex:none;color:var(--muted)}
.chipx .x{border:0;background:transparent;color:var(--faint);cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;padding:0;transition:background-color 150ms ease,color 150ms ease}
/* menu do botão direito: material translúcido estilo macOS */
.cmenu{position:fixed;z-index:31;min-width:236px;max-width:300px;padding:5px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-radius:var(--r-md);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 12px 32px -8px rgba(0,0,0,.28);outline:0;
  opacity:0;transform:scale(0.97);visibility:hidden;pointer-events:none;transition:opacity 120ms var(--ease-out),transform 150ms var(--ease-out),visibility 0s linear 150ms}
.cmenu.open{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity 150ms var(--ease-out),transform 180ms var(--ease-out),visibility 0s}
.cm-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:13px;color:var(--fg);text-align:left;cursor:default}
.cm-it.act{background:var(--accent);color:#fff}
.cm-ic{width:16px;flex:none;display:grid;place-items:center;color:var(--muted)}
.cm-it.act .cm-ic,.cm-it.act kbd{color:rgba(255,255,255,.85)}
.cm-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-it kbd{font-family:var(--sans);font-size:11.5px;color:var(--faint)}
.cm-it.danger,.cm-it.danger .cm-ic{color:var(--bad)}
.cm-it.danger.act{background:var(--bad);color:#fff}
.cm-it.danger.act .cm-ic{color:#fff}
.cm-sep{height:1px;background:var(--line);margin:5px 8px}
.cm-h{font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 8px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* aba Ações */
.seg button .cnt{margin-left:4px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 5px}
.act-card{display:flex;flex-direction:column;gap:8px;padding:12px;margin:0 2px 8px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.act-top{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.act-top .lab{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-cmd{display:block;font-family:var(--mono);font-size:11.5px;background:var(--subtle);padding:6px 8px;border-radius:6px;overflow-x:auto;white-space:nowrap}
.act-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act-t{margin:0;font-size:13px;line-height:1.4}
.ico.sm{width:22px;height:22px}
.ico.sm svg{width:12px;height:12px}
.empty-act{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 16px 12px;font-size:12.5px;color:var(--muted)}
.empty-act b{color:var(--fg);font-size:13.5px}
.pol{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
.pol code,.tags code{font-family:var(--mono);font-size:11.5px}
.badge-btn{border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:500}
/* medidor de contexto */
.meter{display:flex;flex-direction:column;gap:6px}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.meter-top b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.meter.over .meter-top b{color:var(--warn)}
.stack{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.stack i{flex-basis:0;min-width:3px;border-radius:2px}
.k-repo{background:#3fb39f} .k-issue{background:#f08a4b} .k-note{background:#e9c46a} .k-other{background:#b4b4ba} .k-sum{background:#8fb5f5} .k-free{background:var(--hover)}
.chipx .tk{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chipx em{font-style:normal;font-size:10.5px;color:var(--accent)}
.chipx.sum{background:var(--accent-soft)}
.chipx .mini{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong);font-size:11px;padding:1px 8px;border-radius:999px;cursor:pointer;color:var(--fg);transition:transform 160ms var(--ease-out)}
.chipx .mini:active{transform:scale(0.96)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sugg .lab{width:100%;font-size:12px}
.chip-s{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line-strong);background:transparent;font-size:12px;padding:3px 9px;border-radius:var(--r-sm);color:var(--muted);cursor:pointer;max-width:100%;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.chip-s:active{transform:scale(0.97)}
.chip-s svg{width:11px;height:11px;flex:none}
.tl-ag .tl-dot.k-ask{background:#e0a100}
.tl-ag .tl-dot.k-done{background:var(--ok)}
/* automações */
.rules{display:flex;flex-direction:column;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.rule{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.rule:first-child{border-top:0}
.rule-tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rule-when{font-size:13px;font-weight:600}
.rule-then{font-size:13px;color:var(--accent)}
.rule .lab{font-size:12px}
.switch{position:relative;width:36px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background-color 200ms ease}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 200ms var(--ease-out)}
.switch input:checked+i{background:var(--ok)}
.switch input:checked+i::after{transform:translateX(14px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.stage.bad{background:var(--bad-soft);color:var(--bad)}
.ctx-empty{font-size:12.5px;color:var(--faint);margin:0}
.cpop{position:fixed;z-index:30;display:flex;flex-direction:column;max-height:min(480px,72vh);background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px rgba(0,0,0,.07),0 4px 8px rgba(0,0,0,.04),0 24px 56px -18px rgba(0,0,0,.3);overflow:hidden;
  opacity:0;transform:scale(0.97);visibility:hidden;pointer-events:none;transition:opacity 140ms var(--ease-out),transform 180ms var(--ease-out),visibility 0s linear 180ms}
.cpop.open{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity 160ms var(--ease-out),transform 200ms var(--ease-out),visibility 0s}
.cpop.creating .cp-search,.cpop.creating .cp-list{display:none}
.cp-search{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--faint)}
.cp-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--fg)}
.cp-search input::placeholder{color:var(--faint)}
.cp-list{overflow:auto;padding:4px 6px 8px;flex:1;min-height:0;overscroll-behavior:contain}
.cp-h{font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 8px 4px}
.cp-it{display:grid;grid-template-columns:26px minmax(0,1fr) 20px;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--fg);transition:background-color 120ms ease}
.cp-it.act{background:var(--hover)}
.cp-it .tx{display:flex;flex-direction:column;min-width:0}
.cp-it .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-it .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-it .ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;color:#fff;box-shadow:inset 0 0 0 1.5px var(--line-strong);transition:background-color 150ms ease,box-shadow 150ms ease}
.cp-it.on .ck{background:var(--accent);box-shadow:none}
.cp-it .ck.plus{box-shadow:none;color:var(--muted)}
.ico.doc{background:var(--hover);color:var(--muted)}
.cp-empty{margin:0;padding:18px 10px;font-size:13px;color:var(--muted);text-align:center}
.cp-foot{border-top:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:2px}
.cp-new .t{color:var(--note)}
.cp-hint{display:flex;justify-content:space-between;gap:8px;padding:6px 8px 4px;font-size:11px;color:var(--faint);flex-wrap:wrap}
.cp-hint kbd{font-family:var(--mono);font-size:10.5px;padding:0 4px;border-radius:4px;background:var(--hover);color:var(--muted)}
.cp-form{display:flex;flex-direction:column;gap:8px;padding:8px}
.cp-form-h{display:flex;align-items:center;gap:6px;font-size:13px}
.ctx-add{appearance:none;-webkit-appearance:none;border:0;font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--r-sm);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer;color:var(--fg)}

/* painel do agente */
.ag-head{display:flex;flex-direction:column;gap:4px}
.ag-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ag-sub{font-size:13px;color:var(--muted);margin:0}
.ag-actions{display:flex;gap:8px}
.ag-actions .btn.primary{flex:1;justify-content:center;padding-block:9px}
.callout.info{background:var(--accent-soft);color:#123a7a}
.callout{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:var(--r-md);background:var(--warn-soft);color:#5c3d00;font-size:13px;line-height:1.4}
.callout .btn{margin-left:auto;flex:none}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.prog-meta b{color:var(--fg);font-weight:500}
.segs{display:flex;gap:4px;height:6px}
.segs i{flex:1;border-radius:3px;background:var(--hover);transition:background-color 200ms ease}
.segs i.done{background:var(--ok)} .segs i.running,.segs i.coordinating{background:var(--accent)} .segs i.waiting{background:#e0a100}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transition:transform 300ms var(--ease-out)}
.bar.done i{background:var(--ok)}
.now{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--subtle);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.foot-danger{border-top:1px solid var(--line);padding-top:14px}
pre.cmd{margin:0;padding:12px 14px;background:var(--subtle);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-md);font-family:var(--mono);font-size:11px;line-height:1.65;overflow-x:auto;white-space:pre;color:#3a3a3c}
pre.cmd .c{color:var(--faint)}
.tree,.tree ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tree ul{padding-left:12px;margin:4px 0 0 13px;border-left:1.5px solid var(--line)}
.tree button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:1px;text-align:left;padding:8px 10px;border-radius:var(--r-sm);border:0;background:var(--subtle);cursor:pointer}
.tree button.cur{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.tree .sd{grid-column:1;grid-row:1 / 3}
.tree .nm{grid-column:2;grid-row:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function applyView(){

  canvas.style.backgroundSize = `${22*k}px ${22*k}px`;

/* movimento: curvas da skill; câmera usa ease-in-out (movimento na tela) */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)', EASE_IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)';
let glideT = 0, gliding = false;
function glideTo(v, dur = 280){
  if (RM.matches){ S.view = v; applyView(); return; }
  world.style.transition = `transform ${dur}ms ${EASE_IN_OUT}`;
  canvas.style.transition = `background-position ${dur}ms ${EASE_IN_OUT}, background-size ${dur}ms ${EASE_IN_OUT}`;
  S.view = v; applyView(); gliding = true;
  clearTimeout(glideT); glideT = setTimeout(() => stopGlide(false), dur + 30);
}
// interrompe a câmera onde ela está agora, para o arrasto continuar sem salto
function stopGlide(freeze = true){
  if (!gliding) return;
  if (freeze){ const m = new DOMMatrix(getComputedStyle(world).transform); S.view = {x:m.e, y:m.f, k:m.a}; }
  world.style.transition = canvas.style.transition = ''; gliding = false; clearTimeout(glideT);
  if (freeze) applyView();
}
// área do canvas não coberta pelos painéis flutuantes
function safeArea(){
  const W = canvas.clientWidth, H = canvas.clientHeight, wide = W > 860;
  const left = wide && !$('.main').classList.contains('side-hidden') ? 320 : 0;
  const right = wide && $('#insp').classList.contains('open') ? 396 : 0;
  return { x:left, y:56, w:W-left-right, h:H-56-(wide ? 16 : 70) };
}
function zoomAt(f, cx, cy, animate){
  const v = S.view, k2 = Math.min(1.6, Math.max(.2, v.k*f));
  const nv = { k:k2, x:cx - (cx - v.x) * k2 / v.k, y:cy - (cy - v.y) * k2 / v.k };
  if (animate) glideTo(nv, 200); else { S.view = nv; applyView(); }
}
function fit(animate){
  if (!S.nodes.length) return;
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  S.nodes.forEach(n => { const r = rect(n); a=Math.min(a,r.x); b=Math.min(b,r.y); c=Math.max(c,r.x+r.w); d=Math.max(d,r.y+r.h); });
  const A = safeArea(), pad = 36;
  const k = Math.min(1, (A.w-pad*2)/(c-a), (A.h-pad*2)/(d-b));
  const nv = {k, x:A.x + (A.w-(c-a)*k)/2 - a*k, y:A.y + Math.max(pad*.4,(A.h-(d-b)*k)/2) - b*k};
  if (animate) glideTo(nv, 300); else { S.view = nv; applyView(); }
}
const viewCenter = () => { const v = S.view, A = safeArea(); return { x:(A.x + A.w/2 - v.x)/v.k, y:(A.y + A.h/2 - v.y)/v.k }; };
function enterEl(el){

function link(from, to, kind){ S.edges.push({from, to, kind}); drawEdges(); }
const LIVE = ['running','waiting','coordinating'];
// cada aresta mantém o próprio <path>: só o "d" e a classe mudam, e a entrada pode ser animada uma vez
function drawEdges(){
  S.edges.forEach(e => {
    if (!e.el){
      e.el = document.createElementNS('http://www.w3.org/2000/svg', 'path'); edgeg.appendChild(e.el);
      if (!S.quiet) e.el.animate([{opacity:0},{opacity:1}], {duration:320, delay:80, easing:EASE_OUT, fill:'backwards'});
    }
    const A = rect(e.from), B = rect(e.to);
    let p;
    if (B.y >= A.y + A.h - 10){
      const x1=A.x+A.w/2, y1=A.y+A.h, x2=B.x+B.w/2, y2=B.y-3, m=(y2-y1)/2;
      p = `M${x1},${y1} C${x1},${y1+m} ${x2},${y2-m} ${x2},${y2}`;
    } else {
      const lr = B.x > A.x, x1 = lr?A.x+A.w:A.x, y1=A.y+Math.min(A.h/2,60), x2 = lr?B.x-3:B.x+B.w+3, y2=B.y+Math.min(B.h/2,60), m=(x2-x1)/2;
      p = `M${x1},${y1} C${x1+m},${y1} ${x2-m},${y2} ${x2},${y2}`;
    }
    const live = e.to.type==='term' && LIVE.includes(e.to.data.status);
    const cls = e.kind==='note' ? 'edge note' : 'edge' + (e.kind==='spawn'?' spawn':'') + (e.kind==='mr'?' mrk':'') + (live?' live':'');
    const mk = e.kind==='note' ? 'arrN' : live ? 'arrA' : e.kind==='mr' ? 'arrM' : 'arr';
    e.el.setAttribute('d', p);
    if (e.el.getAttribute('class') !== cls) e.el.setAttribute('class', cls);
    e.el.setAttribute('marker-end', `url(#${mk})`);
  });
}
function dropEdges(pred){
  S.edges = S.edges.filter(e => { if (pred(e)){ e.el && e.el.remove(); e.el = null; return false; } return true; });
}

/* ---------- roteiros simulados ---------- */
function buildScript(a){
  const L = [], p = (...s) => L.push(s), i = a.issue, t = a.task;
  const readNotes = () => (a.notes||[]).forEach(nt => { p('tool','Read',`nota “${nt.title}”`); p('out','⎿ '+firstLine(nt.body)); });
  if (a.role === 'orch'){
    p('sys', `${a.name} · orquestrador${i?' · issue #'+i.iid:''}`);
    p('dim', 'contexto: ' + a.ctx.join(' · '));
    if (a.extra) p('user', a.extra);
    readNotes();
    p('txt', i ? `Lendo a issue #${i.iid} e mapeando os repositórios afetados.` : 'Mapeando os repositórios escolhidos para esta tarefa.');
    a.tasks.forEach(tk => { p('tool','Grep',`${tk.grep} em ${tk.repo}`); p('out',`⎿ ${tk.files[0]}`); });
    p('txt', `A tarefa toca ${a.tasks.length} repositórios. Vou criar um agente para cada um${a.tasks.some(x=>x.repo==='shared-contracts')?', começando pelo contrato compartilhado':''}.`);
    p('plan'); p('workers'); p('wait');
    p('txt','Todos os agentes terminaram. Conferindo se os MRs usam o mesmo contrato.');
    p('summary');
    if (i){ p('tool','Bash',`glab issue note ${i.iid} -m "<resumo dos MRs>"`); p('out','⎿ resumo publicado na issue'); }
    p('done', `Pronto. Ordem sugerida de merge: ${a.tasks.map(x=>x.repo).sort((x,y)=>MERGE_ORDER.indexOf(x)-MERGE_ORDER.indexOf(y)).join(' → ')}.`);
    return L;
  }
  if (a.role === 'fix'){
    const spec = t.files[t.files.length-1];
    p('sys', `${a.name} · correção de pipeline · !${a.mr.iid}`);
    p('dim', 'contexto: ' + a.ctx.join(' · '));
    p('tool','Bash',`glab ci trace --branch ${a.branch}`); p('out','⎿ FAIL ' + spec + ' · expected 1, received 2');
    p('txt','O teste quebrou porque o fixture ainda usa o formato antigo. Vou ajustar o fixture, não a regra.');
    p('tool','Edit', spec); p('del','-  const rows = fixture.legacy()'); p('add','+  const rows = fixture.withFormat("csv")');
    p('ask', t.test);
    p('tool','Bash', t.test); p('out','⎿ ' + t.testOut);
    p('tool','Bash','git push'); p('out',`⎿ commit enviado para !${a.mr.iid}`);
    p('done', `Pipeline do !${a.mr.iid} corrigido.`);
    return L;
  }
  if (a.role === 'review'){
    p('sys', `${a.name} · revisão de !${a.mr.iid}`);
    p('dim', 'contexto: ' + a.ctx.join(' · '));
    p('tool','Bash',`glab mr diff ${a.mr.iid}`); p('out',`⎿ ${a.mr.add+a.mr.del} linhas em ${t.files.length} arquivos`);
    p('txt','Revisando com foco em regressões e casos de borda.');
    p('tool','Read',t.files[0]); p('out','⎿ ok');
    p('txt','Deixei 2 sugestões: tratar erro de concorrência e cobrir o caso de lista vazia.');
    p('tool','Bash',`glab mr note ${a.mr.iid} -m "<revisão>"`); p('out','⎿ 2 comentários publicados');
    p('done',`Revisão concluída no MR !${a.mr.iid}.`);
    return L;
  }
  if (a.role === 'sub'){
    p('sys', `${a.name} · sub-agente de ${a.parent.name} · ${a.repo}`);
    p('dim', 'contexto herdado: ' + a.ctx.join(' · '));
    p('tool','Read',t.files[t.files.length-1]); p('out','⎿ 3 cenários existentes');
    p('txt','Escrevendo cenários para os critérios de aceite.');
    p('tool','Write',t.files[t.files.length-1]); p('add','+  it("cobre o caminho feliz", …)'); p('add','+  it("cobre reenvio e erro", …)');
    p('tool','Bash',t.test); p('out','⎿ '+t.testOut);
    p('done',`Testes commitados em ${a.branch}. Avisei ${a.parent.name}.`);
    return L;
  }
  p('sys', `${a.name} · ${a.repo}${i?' · issue #'+i.iid:''}${a.parent?' · criado por '+a.parent.name:''}`);
  p('dim', 'contexto: ' + a.ctx.join(' · '));
  if (a.extra) p('user', a.extra);
  readNotes();
  p('txt', a.parent ? `Assumindo a parte de ${a.repo} do plano.` : 'Lendo o contexto e o código relacionado.');
  p('tool','Read',t.files[0]); p('out',`⎿ ${120+(t.files[0].length*17)%180} linhas`);
  p('tool','Grep',t.grep); p('out','⎿ 4 ocorrências em 3 arquivos');
  if (t.sub && a.depth < a.maxDepth){ p('txt','A parte de testes é grande. Vou abrir um sub-agente para escrevê-los em paralelo.'); p('spawn'); }
  p('txt', t.finding);
  p('tool','Edit',t.files[0]); t.diff.forEach(d => p(d[0]==='-'?'del':'add', d));
  p('ask', t.test);
  p('tool','Bash',t.test); p('out','⎿ '+t.testOut);
  p('tool','Bash',`git push -u origin ${a.branch}`); p('out','⎿ branch enviada');
  if (a.openMr) p('mr');
  p('done', a.openMr ? `MR aberto em ${a.repo}${i?' e vinculado à issue #'+i.iid:''}.` : 'Alterações enviadas para o branch.');
  return L;
}

function line(a, cls, html){
  const d = document.createElement('div'); d.className = 'l '+cls; d.innerHTML = html;
  a.lines.push(d);
  if (a.body){
    const b = a.body, stick = b.scrollHeight - b.scrollTop - b.clientHeight < 64;
    b.appendChild(d);
    if (stick) b.scrollTo({ top:b.scrollHeight, behavior: RM.matches || S.quiet ? 'auto' : 'smooth' });
  }
  return d;
}
function exec(a, s, instant){
  const [t, x, y] = s;
  if (t==='tool'){ line(a,'tool',`<span class="g">●</span> <b>${x}</b>(${esc(y)})`); ev(a,'tool',`${x}(${y})`); a.tokens = (a.tokens||0) + 600 + (String(y).length*37 % 900); }
  else if (t==='txt') line(a,'txt',`<span class="g">●</span> ${esc(x)}`);
  else if (t==='user') line(a,'user',`<small>Você</small>${esc(x)}`);
  else if (t==='spawn') spawnSub(a, instant);
  else if (t==='mr') openMR(a, instant);
  else if (t==='plan'){
    const d = line(a,'plan-wrap',`<div class="plan"><b>Plano</b>${a.tasks.map((tk,j)=>`<div class="it" data-j="${j}"><span class="ck"></span><span class="tx">${tk.repo}</span><span class="who"></span></div>`).join('')}</div>`);
    a.planEl = d;
  }
  else if (t==='workers') spawnWorkers(a, instant);
  else if (t==='wait'){
    if (a.children.filter(c=>c.role==='main').every(c => ['done','stopped'].includes(c.status))) return;
    setStatus(a,'coordinating'); return 'pause';
  }
  else if (t==='summary'){
    const mrs = a.children.filter(c=>c.mr).map(c=>`!${c.mr.iid} ${c.repo}`);
    line(a,'txt',`<span class="g">●</span> MRs abertos: ${esc(mrs.join(', ') || 'nenhum')}.`);
  }
  else if (t==='ask'){
    if (instant){ line(a,'out','⎿ permitido'); return; }
    a.askCmd = x; ev(a,'ask','Pediu permissão: ' + x);
    const rule = allowedByPolicy(x);
    if (rule){ line(a,'out',`⎿ permitido pela regra "${esc(rule)}"`); return; }
    a.askEl = line(a,'ask',`<div>Posso rodar <code>${esc(x)}</code>?</div><div class="acts"><button class="btn sm primary" data-act="approve" data-aid="${a.id}">Permitir</button><button class="btn sm" data-act="deny" data-aid="${a.id}">Negar</button></div>`);
    setStatus(a,'waiting'); log(`${a.name} pede permissão para rodar ${x}`);
    if (!S.quiet && F.a!==a && S.sel!==a.node.id) showToast(`${a.name} pede permissão para rodar ${x}`, { label:'Revisar', fn:() => openFocus(a) });
    return 'pause';
  }
  else if (t==='done'){ ev(a,'done','Concluiu'); line(a,'done','✓ '+esc(x)); setStatus(a,'done'); log(`${a.name} concluiu`); return 'pause'; }
  else line(a, t, esc(x));
}
function run(a){
  clearTimeout(a.timer);

  const s = a.script[a.step++];
  if (!s){ setStatus(a,'done'); return; }
  if (exec(a, s) === 'pause') return;
  patchProgress(a);
  const d = s[0]==='tool' ? 950 : (s[0]==='add'||s[0]==='del') ? 240 : 650;
  a.timer = setTimeout(() => run(a), d + Math.random()*450);
}
// atualiza só a barra, o percentual e a etapa atual, sem redesenhar o painel
function patchProgress(a){
  if (a.role==='orch') return;
  const boxes = [];
  if (S.sel === a.node?.id) boxes.push($('#inspB'));
  const pct = Math.min(1, a.step / a.script.length);
  boxes.forEach(b => {
    const bar = b.querySelector('.bar i'); if (!bar) return;
    bar.style.transform = `scaleX(${pct.toFixed(3)})`;
    b.querySelector('.prog-meta b').textContent = Math.round(pct*100) + '%';
    const now = b.querySelector('.now'); if (now) now.textContent = currentStep(a);
    const st = b.querySelectorAll('.stat b'); if (st[0]) st[0].textContent = `${Math.min(a.step,a.script.length)}/${a.script.length}`; if (st[1]) st[1].textContent = fmtK(a.tokens||0);
  });
}
function runInstant(a){ while (a.step < a.script.length){ if (exec(a, a.script[a.step++], true) === 'pause' && a.status!=='done') break; } }
function setStatus(a, st){
  a.status = st; refreshChrome(a); drawEdges(); updateStats();
  if (a.planIt){ a.planIt.className = 'it ' + (st==='done'?'ok':['stopped','paused'].includes(st)?'':'wip'); a.planIt.querySelector('.ck').textContent = st==='done'?'✓':''; }
  if ((st==='done'||st==='stopped') && a.parent && a.parent.status==='coordinating' &&
      a.parent.children.filter(c=>c.role==='main').every(c => ['done','stopped'].includes(c.status))){
    setStatus(a.parent,'running'); setTimeout(()=>run(a.parent), 600);
  }
  if (st==='done' && !a.posted){
    a.posted = true;
    if (a.role==='fix' && a.mr){
      const m = a.mr, mn = m.node; m.pipeline = 'running'; m.fixer = null; renderNode(mn);
      setTimeout(() => { m.pipeline = 'passed'; if (S.nodes.includes(mn)) renderNode(mn); log(`Pipeline do !${m.iid} passou`); if (F.n===mn) refreshDoc(); updateStats(); }, 3500);
    }
    if (auto('handoff') && !S.quiet && !a.blank && (a.role==='orch' || (a.role==='main' && !a.parent))) setTimeout(() => createHandoff(a), 500);
    if (a.role==='review' && a.mr) a.mr.thread.push({ who:a.name, bot:true, t:'agora', text:'Revisão: deixei 2 sugestões. Tratar o erro de concorrência e cobrir o caso de lista vazia.' });
    if (a.role==='orch' && a.issue){
      const mrs = a.children.filter(c => c.mr).map(c => `!${c.mr.iid} (${c.repo})`).join(', ');
      a.issue.thread.push({ who:a.name, bot:true, t:'agora', text:`Resumo: ${mrs || 'nenhum MR'} abertos. Ordem sugerida de merge: ${a.tasks.map(x=>x.repo).sort((x,y)=>MERGE_ORDER.indexOf(x)-MERGE_ORDER.indexOf(y)).join(' → ')}.` });
    }
  }
  if (F.n && (F.n.type==='issue' || F.n.type==='mr')) refreshDoc();
  const sn = S.sel && nodeBy(S.sel);
  if (sn && (sn.type==='issue' || (sn.type==='term' && rootOf(sn.data)===rootOf(a)))) renderInspector();
}

/* ---------- criação de agentes ---------- */
function createAgent(o){
  const a = Object.assign({ id:'a'+(++agentSeq), name:'agente-'+agentSeq, status:'running', lines:[], events:[], tokens:0, step:0, role:'main', depth:0, maxDepth:2, openMr:true, children:[], ctx:[] }, o);
  if (!a.branch) a.branch = 'agent/' + (a.issue ? a.issue.iid+'-'+slug(a.issue.short) : 'solo-'+slug(a.title||'tarefa'));
  if (a.parent) a.parent.children.push(a);
  (a.notes||[]).forEach(nt => { nt.users.add(a); if (!a.ctx.includes(noteLabel(nt))) a.ctx.push(noteLabel(nt)); });
  a.script = a.blank ? [] : buildScript(a);
  a.tokens = ctxTotal(a);
  agents.push(a);
  return a;
}
function addTermNode(a, cands, from, kind){
  const pos = freeSpot(cands, 400, 330);
  const tn = addNode('term', pos.x, pos.y, a); a.node = tn;
  if (from) link(from, tn, kind);
  return tn;
}
function startRoot(o, anchorNode){
  const a = createAgent(o);
  let cands;
  if (anchorNode){ const r = rect(anchorNode); cands = [{x:r.x+r.w/2-200, y:r.y+r.h+70},{x:r.x+r.w+60,y:r.y}]; }
  else { const c = viewCenter(); cands = [{x:c.x-200, y:c.y-165}]; }
  addTermNode(a, cands, anchorNode, 'issue');
  log(`${a.name} iniciado${a.issue?' na issue #'+a.issue.iid:' (solo)'}`);
  if (anchorNode) renderNode(anchorNode);
  updateStats();
  return a;
}
function spawnWorkers(o, instant){
  const r = rect(o.node), n = o.tasks.length, W = 400, gap = 36, total = n*W+(n-1)*gap;
  o.tasks.forEach((tk, j) => {
    const w = createAgent({ issue:o.issue, task:tk, repo:tk.repo, parent:o, depth:o.depth+1, maxDepth:o.maxDepth, openMr:o.openMr, title:o.title,
      notes:notes.filter(nt => nt.users.has(o) && !nt.removed),
      ctx:[o.issue?'issue #'+o.issue.iid:'instrução do usuário', 'plano de '+o.name, 'repo '+tk.repo, 'CLAUDE.md'] });
    addTermNode(w, [{x:r.x+r.w/2-total/2+j*(W+gap), y:r.y+r.h+80}], o.node, 'spawn');
    w.planIt = o.planEl.querySelector(`[data-j="${j}"]`); w.planIt.querySelector('.who').textContent = w.name; w.planIt.className = 'it wip';
    log(`${o.name} criou ${w.name} para ${tk.repo}`);
    if (instant) runInstant(w); else setTimeout(() => run(w), 400 + j*350);
  });
  line(o,'out',`⎿ ${n} agentes criados`);
  if (o.issue) renderNode(issueNodeOf(o.issue));
  updateStats();
}
function spawnSub(p, instant){
  const s = createAgent({ issue:p.issue, task:p.task, repo:p.repo, role:'sub', parent:p, depth:p.depth+1, maxDepth:p.maxDepth, branch:p.branch, ctx:['plano de '+p.name, 'repo '+p.repo] });
  const r = rect(p.node);

}
function openMR(a, instant){
  const m = { iid:mrSeq++, title:(a.issue?`#${a.issue.iid} `:'')+(a.issue?a.issue.short:a.title), repo:a.repo, branch:a.branch,
    add:30+(a.task.files[0].length*13)%150, del:4+(a.task.files[0].length*3)%30, pipeline: instant?'passed':'running', thread:[], issue:a.issue, agent:a, task:a.task };
  a.mr = m;

  const mn = addNode('mr', pos.x, pos.y, m); m.node = mn;

  if (!instant) setTimeout(() => { m.pipeline='passed'; renderNode(mn); log(`Pipeline do !${m.iid} passou`); if (S.sel===mn.id) renderInspector(); if (F.n===mn) refreshDoc(); updateStats(); }, 7000);
  if (!instant && auto('auto-review')) setTimeout(() => { if (S.nodes.includes(mn)) fire('review', { nid:mn.id }); }, 1500);
}
function tell(a, msg){
  line(a,'user',`<small>Você</small>${esc(msg)}`);
  if (a.blank){ startBlank(a, msg); return; }
  log(`Você → ${a.name}: ${msg}`);
  if (a.role === 'orch'){
    const act = a.children.filter(c => !['done','stopped'].includes(c.status));
    line(a,'txt',`<span class="g">●</span> Repassando a instrução para ${act.length} agente${act.length===1?'':'s'}.`);
    act.forEach(c => { line(c,'user',`<small>Via ${a.name}</small>${esc(msg)}`); c.script.splice(c.step,0,['txt','Anotado, sigo com isso em mente.']); });
    return;
  }
  const extra = [['txt','Entendido. Ajustando.'],['tool','Edit',a.task.files[0]],['add','+  // ajuste: '+msg.slice(0,40)],['tool','Bash','git push'],['out','⎿ commit enviado'+(a.mr?` para !${a.mr.iid}`:'')],['done','Ajuste aplicado.']];
  if (['done','stopped'].includes(a.status)){ a.script.push(...extra); setStatus(a,'running'); setTimeout(()=>run(a),500); }
  else a.script.splice(a.step, 0, ['txt','Anotado, vou considerar isso no próximo passo.']);
}
function addContext(a, label){
  if (a.ctx.includes(label)) return;
  a.ctx.push(label);

}

/* ---------- agente em branco: nasce no canvas, recebe contexto, começa na primeira instrução ---------- */
function newBlankAgent(at, repo){
  const a = createAgent({ blank:true, status:'idle', title:'Novo agente', ctx: repo ? ['repo '+repo] : [] });
  const c = at || viewCenter();
  addTermNode(a, [{x:c.x-200, y:c.y-165}]);
  line(a, 'empty', `<div class="empty-term"><b>${a.name} pronto</b>
    <span>Monte o contexto antes de começar:</span>
    <ul><li>arraste repositórios ou issues da barra lateral para esta janela</li>
    <li>arraste o + de uma nota até aqui</li><li>ou use "+ Adicionar" no painel ao lado</li></ul>
    <span>Depois escreva a primeira instrução abaixo.</span></div>`);
  if (repo) line(a,'dim',`+ contexto: repo ${esc(repo)}`);
  log(`${a.name} criado. Aguardando contexto e instrução.`);
  updateStats(); renderSide();
  if (at) select(a.node.id); else focusNode(a.node);
  return a;
}
function startBlank(a, msg){
  const repos = a.ctx.filter(c => c.startsWith('repo ')).map(c => c.slice(5));
  const iss = a.ctx.map(c => c.match(/^issue #(\d+)/)).filter(Boolean).map(m => issueBy(+m[1]))[0] || null;
  if (!repos.length && iss) repos.push(...new Set(iss.tasks.map(t => t.repo)));
  if (!repos.length){
    line(a,'txt',`<span class="g">●</span> Antes de começar, preciso saber em qual repositório trabalhar. Arraste um repositório para esta janela ou adicione pelo painel.`);
    return;
  }
  a.blank = false; a.extra = null; a.issue = iss;
  a.title = msg.length > 60 ? msg.slice(0,58)+'…' : msg;
  const tasks = repos.map(r => (iss && iss.tasks.find(t => t.repo===r)) || genTask(r, iss ? iss.short : msg));
  if (repos.length > 1){ a.role = 'orch'; a.tasks = tasks; } else { a.task = tasks[0]; a.repo = repos[0]; }
  a.branch = 'agent/' + (iss ? iss.iid+'-'+slug(iss.short) : 'solo-'+slug(msg));
  a.notes = activeNotes(notes).filter(nt => nt.users.has(a));
  a.script = buildScript(a).filter(st => st[0] !== 'sys');
  a.step = 0;
  const el = a.node.el;
  el.querySelector('.wsub').textContent = `${roleLabel(a)} · ${a.role==='orch' ? a.tasks.length+' repositórios' : a.repo}`;
  el.querySelector('.composer input').placeholder = a.role==='orch' ? 'Instrução para todos os agentes' : 'Mensagem para '+a.name;
  el.querySelector('.win').classList.toggle('orch', a.role==='orch');
  const iN = iss && issueNodeOf(iss);
  if (iN){ link(iN, a.node, 'issue'); renderNode(iN); }
  log(`${a.name} começou${repos.length>1 ? ' como orquestrador de '+repos.length+' repositórios' : ' em '+repos[0]}`);
  setStatus(a,'running'); setTimeout(() => run(a), 300);
}

/* ---------- notas ---------- */
const notes = [];
let noteSeq = 0;
const noteLabel = nt => 'nota: ' + nt.title;
const noteById = id => notes.find(nt => nt.id === id);
const firstLine = s => { const l = (s||'').split('\n').map(x=>x.trim()).filter(Boolean)[0] || '(nota vazia)'; return l.length>90 ? l.slice(0,88)+'…' : l; };
function createNote(at, title, body){
  const nt = { id:'t'+(++noteSeq), title:title || 'Nova nota', body:body || '', links:[], users:new Set() };
  notes.push(nt);
  const c = at || viewCenter();
  const pos = freeSpot([{x:c.x-135, y:c.y-90}], 270, 200);
  nt.node = addNode('note', pos.x, pos.y, nt);
  log(`Nota "${nt.title}" criada`);
  return nt;
}
function noteMeta(nt, el){
  const s = (el || (nt.node && nt.node.el))?.querySelector('.nlinks');
  if (s) s.textContent = nt.links.length ? `${nt.links.length} vínculo${nt.links.length>1?'s':''}` : 'Sem vínculos';
}
function giveNote(a, nt){
  if (nt.users.has(a)) return;
  nt.users.add(a);
  if (!a.ctx.includes(noteLabel(nt))) a.ctx.push(noteLabel(nt));
  if (['running','waiting','coordinating','paused'].includes(a.status)){
    line(a,'tool',`<span class="g">●</span> <b>Read</b>(nota “${esc(nt.title)}”)`);
    line(a,'txt',`<span class="g">●</span> Li a nota. Vou levar em conta: ${esc(firstLine(nt.body))}`);
    if (a.role==='orch') a.children.forEach(c => giveNote(c, nt));
  } else line(a,'dim',`+ contexto: ${esc(noteLabel(nt))}`);
}
function linkNote(nt, target){
  if (!target || nt.links.includes(target) || !['term','issue'].includes(target.type)) return;
  nt.links.push(target); link(nt.node, target, 'note');
  if (target.type==='term') giveNote(target.data, nt);
  else { target.data.notes.push(nt); renderNode(target); }
  noteMeta(nt);
  log(`Nota "${nt.title}" vinculada a ${target.type==='term' ? target.data.name : 'issue #'+target.data.iid}`);
  renderInspector();
}
function unlinkNote(nt, target){
  nt.links = nt.links.filter(x => x!==target);
  dropEdges(e => e.from===nt.node && e.to===target);
  if (target.type==='term'){ const a = target.data; a.ctx = a.ctx.filter(c => c!==noteLabel(nt)); nt.users.delete(a); line(a,'dim',`− contexto removido: ${esc(noteLabel(nt))}`); }
  else { const i = target.data; i.notes = i.notes.filter(x => x!==nt); renderNode(target); }
  noteMeta(nt); renderInspector();
}
function renameNote(nt, title){
  const old = noteLabel(nt); nt.title = title; nt.dirty = true;
  nt.users.forEach(a => { a.ctx = a.ctx.map(c => c===old ? noteLabel(nt) : c); });
}
function noteEdited(nt){
  if (!nt.dirty) return; nt.dirty = false;
  nt.users.forEach(a => { if (!['done','stopped'].includes(a.status)) line(a,'dim',`↻ nota “${esc(nt.title)}” atualizada, relendo`); });
  log(`Nota "${nt.title}" editada`);
}
function newNoteAt(at, linkTo){
  const nt = createNote(at);
  if (linkTo) linkNote(nt, linkTo);
  select(nt.node.id);
  const ti = nt.node.el.querySelector('.ntitle-in'); ti.focus(); ti.select();
  return nt;
}

/* ---------- remover com desfazer ---------- */
const activeNotes = list => list.filter(nt => !nt.removed);
// um agente leva junto os sub-agentes e os MRs que abriu (só no canvas; nada é apagado no GitLab)
function removalSet(n){
  const set = new Set([n]);
  if (n.type==='term'){
    const walk = a => { set.add(a.node); if (a.mr && a.mr.node) set.add(a.mr.node); a.children.forEach(walk); };
    walk(n.data);
  }
  return [...set].filter(x => x && S.nodes.includes(x));
}
function removeLabel(n, count){
  const base = n.type==='issue' ? `Issue #${n.data.iid}` : n.type==='mr' ? `MR !${n.data.iid}` : n.type==='note' ? `Nota "${n.data.title}"` : n.data.name;
  const extra = count - 1;
  return `${base}${extra ? ` e mais ${extra} ${extra>1?'itens':'item'}` : ''} ${n.type==='note'?'excluída':'removido do canvas'}`;
}
let pendingUndo = null, toastT = 0;
function removeNode(n, animate = true){
  if (!n) return;
  const nodes = removalSet(n);
  const edges = S.edges.filter(e => nodes.includes(e.from) || nodes.includes(e.to));
  const agentState = nodes.filter(x => x.type==='term').map(x => ({ a:x.data, status:x.data.status }));
  agentState.forEach(({a}) => { clearTimeout(a.timer); a.removed = true; if (!['done','stopped'].includes(a.status)) a.status = 'stopped'; });
  nodes.forEach(x => { if (x.type==='note') x.data.removed = true; });
  dropEdges(e => edges.includes(e));
  S.nodes = S.nodes.filter(x => !nodes.includes(x));
  nodes.forEach(x => exitEl(x.el, animate && !RM.matches));
  if (F.n && nodes.includes(F.n)) closeFocus(false);
  if (S.sel && nodes.some(x => x.id===S.sel)) S.sel = null;
  afterStructureChange();
  log(removeLabel(n, nodes.length));
  pendingUndo = () => {
    nodes.forEach(x => {
      if (x.type==='issue' && issueNodeOf(x.data)) return;   // a issue já voltou por outro caminho
      x.el._gone = false; x.el.getAnimations().forEach(an => an.cancel());
      world.appendChild(x.el); S.nodes.push(x); enterEl(x.el);
      if (x.type==='note') x.data.removed = false;
    });
    edges.forEach(e => { if (S.nodes.includes(e.from) && S.nodes.includes(e.to)){ e.el = null; S.edges.push(e); } });
    agentState.forEach(({a, status}) => { a.removed = false; a.status = status; refreshChrome(a); if (status==='running') run(a); });
    afterStructureChange(); log('Remoção desfeita');
  };
  showToast(removeLabel(n, nodes.length));
}
function afterStructureChange(){
  S.nodes.filter(x => x.type==='issue').forEach(renderNode);
  drawEdges(); updateStats(); renderSide(); renderInspector();
}
let toastAct = null;
function showToast(msg, opt){
  $('#toastMsg').textContent = msg;
  $('#toastUndo').textContent = opt ? opt.label : 'Desfazer';
  $('#toast kbd').hidden = !!opt;
  toastAct = opt ? opt.fn : undo;
  $('#toast').classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(hideToast, opt ? 7000 : 6000);
}
function hideToast(){ $('#toast').classList.remove('show'); pendingUndo = null; }
function undo(){ if (!pendingUndo) return; const f = pendingUndo; hideToast(); f(); }

/* ---------- modo foco do agente ---------- */
const SUGGEST = {
  orch:['Qual é o status de cada repositório?','Priorize o shared-contracts','Pause os agentes do front'],
  main:['Explique o que você mudou','Rode os testes de novo','Adicione um teste para o caso de erro'],
  sub:['Quais cenários faltam?','Rode só os testes novos'],
  review:['Resuma os riscos do MR','O que bloqueia o merge?'],
};
function nodeScreenRect(n){
  const r = n.el.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  return { x:r.left - c.left, y:r.top - c.top, w:r.width, h:r.height };
}
// anima a folha a partir da janela do agente no canvas (e volta para ela ao fechar)
function sheetFlip(n, opening){
  const sheet = $('#fSheet'), from = nodeScreenRect(n);
  const s = sheet.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  const to = { x:s.left - c.left, y:s.top - c.top, w:s.width, h:s.height };
  const tf = `translate(${from.x - to.x}px, ${from.y - to.y}px) scale(${from.w / to.w}, ${from.h / to.h})`;
  const frames = RM.matches ? [{opacity:0},{opacity:1}] : [{transform:tf, opacity:.4},{transform:'none', opacity:1}];
  return sheet.animate(opening ? frames : frames.slice().reverse(), { duration: opening ? 340 : 240, easing: opening ? 'cubic-bezier(0.32, 0.72, 0, 1)' : EASE_OUT });
}
// qualquer item do canvas abre em foco: agente (terminal), issue, MR ou nota
const F_KIND = { issue:['issue',ICON.issue], mr:['mr',ICON.mr], note:['note',ICON.note] };
function openFocusNode(n){
  if (!n || !S.nodes.includes(n) || F.n === n) return;
  if (F.a) restoreBody(F.a);
  if (F.n && F.n.type==='note') renderNode(F.n);
  F.n = n; F.a = n.type==='term' ? n.data : null;
  select(n.id);
  const fb = $('#fBody');
  fb.innerHTML = '';
  fb.className = 'f-body' + (n.type==='term' ? '' : ' doc') + (n.type==='note' ? ' note-doc' : '');
  $('#fIcon').innerHTML = n.type==='term' ? '<span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>'
    : `<span class="ico ${F_KIND[n.type][0]}">${F_KIND[n.type][1]}</span>`;
  $('.f-foot').hidden = n.type==='note';
  if (F.a){
    const a = F.a;
    $('#fName').textContent = a.name;
    $('#fSub').textContent = `${roleLabel(a)} · ${a.role==='orch' ? a.tasks.map(t=>t.repo).join(', ') : a.repo}`;
    $('#fInput').placeholder = a.role==='orch' ? 'Instrução para todos os agentes deste orquestrador' : `Converse com ${a.name}`;
    $('#fSugg').innerHTML = (SUGGEST[a.role] || SUGGEST.main).map(s => `<button type="button" data-act="suggest">${esc(s)}</button>`).join('');
    S.quiet = true; a.lines.forEach(l => fb.appendChild(l)); S.quiet = false;   // as linhas mudam de lugar, não são recriadas
    a.body = fb;
    refreshChrome(a);
  } else fillDoc(n);
  layoutFocus();
  const box = $('#focus'); box.classList.add('open'); box.setAttribute('aria-hidden','false');
  fb.scrollTop = F.a ? fb.scrollHeight : 0;
  sheetFlip(n, true);
  if (F.a) setTimeout(() => $('#fInput').focus({preventScroll:true}), 60);
}
const openFocus = a => { if (a && !a.removed) openFocusNode(a.node); };
function restoreBody(a){
  const tb = a.node.el.querySelector('.tbody');
  a.lines.forEach(l => tb.appendChild(l)); a.body = tb; tb.scrollTop = tb.scrollHeight;
}
function closeFocus(animate = true){
  const n = F.n; if (!n) return;
  const a = F.a, box = $('#focus');
  const finish = () => {
    box.classList.remove('open'); box.setAttribute('aria-hidden','true');
    if (a) restoreBody(a);
    if (n.type==='note' && S.nodes.includes(n)) renderNode(n);
  };
  F.n = null; F.a = null; renderInspector();
  if (animate && S.nodes.includes(n)){
    sheetFlip(n, false).onfinish = finish;
    box.querySelector('.focus-bg').style.opacity = '0';
    setTimeout(() => box.querySelector('.focus-bg').style.opacity = '', 260);
  } else finish();
}
// o cartão em foco ocupa o espaço livre entre a barra lateral e o painel da direita
function layoutFocus(){
  if (!F.n) return;
  const W = canvas.clientWidth, wide = W > 860, sh = $('#fSheet').style;
  const left = wide && !$('.main').classList.contains('side-hidden') ? 320 : wide ? 12 : 8;
  const right = wide && $('#insp').classList.contains('open') ? 396 : wide ? 12 : 8;
  sh.left = left + 'px'; sh.right = right + 'px';
  sh.top = '60px'; sh.bottom = wide ? '12px' : '76px';
}
