/* ---------- visões de documento: issue, MR, nota ---------- */
const initials = w => w.replace(/[^a-zA-Z.]/g,'').split('.').map(x => x[0] || '').join('').slice(0,2).toUpperCase() || 'V';
function threadHTML(list){
  if (!list.length) return '<p class="lab" style="margin:0">Sem comentários ainda.</p>';
  return `<div class="thread">${list.map(c => `<div class="cm"><span class="av ${c.bot?'bot':''}">${c.bot ? ICON.agent : initials(c.who)}</span>
    <div><div class="cm-h"><b>${esc(c.who)}</b>${c.bot?'<span class="badge info">agente</span>':''}<time>${esc(c.t)}</time></div><p>${esc(c.text)}</p></div></div>`).join('')}</div>`;
}
function pipelineHTML(m){
  const st = m.pipeline==='passed' ? ['ok','ok','ok'] : m.pipeline==='failed' ? ['ok','bad',''] : ['ok','run',''];
  const names = ['Build','Testes','Lint'];
  return `<div class="pipe">${names.map((nm,j) => `${j?'<span class="ln"></span>':''}<span class="stage ${st[j]}">${st[j]==='ok'?'✓':st[j]==='bad'?'✕':st[j]==='run'?'<span class="badge-dot"></span>':'○'} ${nm}</span>`).join('')}</div>`;
}
function diffFiles(m){
  const f = m.task.files;
  return f.map((file, j) => {
    const lines = j===0 ? ['@@ -18,7 +18,9 @@', '   // ' + (m.issue ? m.issue.short : 'alteração'), ...m.task.diff]
      : j===f.length-1 ? ['@@ -1,4 +1,12 @@', '+  it("cobre o caminho feliz", …)', '+  it("cobre o caso de erro", …)']
      : ['@@ -40,3 +40,5 @@', '   export type Filtro = {', '+    format?: "csv" | "pdf"', '   }'];
    const add = lines.filter(l => l[0]==='+').length, del = lines.filter(l => l[0]==='-').length;
    return `<div class="diff"><div class="diff-h"><span>${esc(file)}</span><span class="diffstat"><span class="a">+${add}</span> <span class="r">−${del}</span></span></div>
      <div class="diff-b">${lines.map(l => `<div class="dl ${l.startsWith('@@')?'hunk':l[0]==='+'?'add':l[0]==='-'?'del':'ctx'}">${esc(l)}</div>`).join('')}</div></div>`;
  }).join('');
}
function docHTML(n){
  if (n.type==='issue'){
    const i = n.data, repos = [...new Set(i.tasks.map(t=>t.repo))];
    const roots = liveAgents().filter(a => a.issue===i && !a.parent && a.role!=='review');
    const mrsN = S.nodes.filter(x => x.type==='mr' && x.data.issue===i);
    const nts = activeNotes(i.notes);
    const crit = i.criteria || ['Comportamento descrito na issue implementado','Testes automatizados cobrindo o cenário','Pipeline verde em todos os repositórios afetados'];
    const doneAll = mrsN.length && mrsN.every(x => x.data.pipeline==='passed');
    return `<div class="fx">
      <div class="fx-head"><div class="tags">${i.labels.map(l=>`<span class="badge ${l==='bug'||l==='P1'?'issue':''}">${l}</span>`).join('')}${repos.map(r=>`<span class="badge repo">${r}</span>`).join('')}</div>
        <h2 class="fx-title">${esc(i.title)}</h2>
        <p class="fx-meta">Aberta por @${i.author} · ${i.thread.length} comentário${i.thread.length===1?'':'s'}</p></div>
      <section><h4>Descrição</h4><p class="fx-p">${esc(i.desc)}</p></section>
      <section><h4>Critérios de aceite</h4><ul class="checklist">${crit.map(c => `<li class="${doneAll?'ok':''}"><span class="ck">${doneAll?'✓':''}</span>${esc(c)}</li>`).join('')}</ul></section>
      ${nts.length ? `<section><h4>Notas vinculadas</h4><div class="fx-notes">${nts.map(nt => `<button class="fx-note" data-act="focus-node" data-nid="${nt.node.id}"><b>${esc(nt.title)}</b><span>${esc(firstLine(nt.body))}</span></button>`).join('')}</div></section>` : ''}
      <section><h4>Agentes</h4>${roots.length ? `<ul class="tree">${roots.map(treeOf).join('')}</ul>` : '<p class="lab" style="margin:0">Nenhum agente ainda. Use "Iniciar agentes" abaixo.</p>'}</section>
      ${mrsN.length ? `<section><h4>Merge requests</h4><div class="links">${mrsN.map(x => `<div class="lk"><span class="ico mr">${ICON.mr}</span><span><b>!${x.data.iid}</b> ${x.data.repo}</span>
          ${mrBadge(x.data)}
          <button class="btn sm plain" data-act="focus-node" data-nid="${x.id}">Abrir</button></div>`).join('')}</div></section>` : ''}
      <section><h4>Discussão</h4>${threadHTML(i.thread)}</section></div>`;
  }
  if (n.type==='mr'){
    const m = n.data, rev = liveAgents().filter(a => a.mr===m && a.role==='review');
    return `<div class="fx">
      <div class="fx-head"><div class="tags"><span class="badge repo">${m.repo}</span><span class="badge">${esc(m.branch)} → main</span></div>
        <h2 class="fx-title">${esc(m.title)}</h2>
        <p class="fx-meta">Aberto por ${m.agent.name}${m.issue ? ` · fecha #${m.issue.iid}` : ''} · <span class="diffstat"><span class="a">+${m.add}</span> <span class="r">−${m.del}</span></span></p></div>
      <section><h4>Pipeline</h4>${pipelineHTML(m)}</section>
      <section><h4>Mudanças · ${m.task.files.length} arquivos</h4>${diffFiles(m)}</section>
      <section><h4>Revisão</h4>${rev.length ? `<ul class="tree">${rev.map(treeOf).join('')}</ul>` : '<p class="lab" style="margin:0">Ninguém revisou ainda. Peça a um agente abaixo.</p>'}</section>
      <section><h4>Discussão</h4>${threadHTML(m.thread)}</section></div>`;
  }
  return '';
}
function fillDoc(n){
  const fb = $('#fBody'), status = $('#fStatus');
  if (n.type==='note'){
    const nt = n.data, links = nt.links.filter(t => S.nodes.includes(t));
    $('#fName').textContent = 'Nota';
    $('#fSub').textContent = links.length ? `Vinculada a ${links.map(t => t.type==='issue' ? '#'+t.data.iid : t.data.name).join(', ')}` : 'Sem vínculos';
    status.className = 'badge'; status.textContent = `${links.length} vínculo${links.length===1?'':'s'}`;
    fb.innerHTML = `<div class="note-ed"><input id="fnTitle" value="${esc(nt.title)}" aria-label="Título da nota">
      <textarea id="fnBody" aria-label="Texto da nota" placeholder="Escreva decisões, regras de negócio, links, trechos de log…">${esc(nt.body)}</textarea>
      <p class="lab" style="margin:0">As alterações salvam na hora. Agentes vinculados leem de novo quando você sai do campo.</p></div>`;
    const ti = $('#fnTitle'), bo = $('#fnBody');
    ti.addEventListener('input', () => renameNote(nt, ti.value.trim() || 'Sem título'));
    bo.addEventListener('input', () => { nt.body = bo.value; nt.dirty = true; });
    ti.addEventListener('change', () => noteEdited(nt));
    bo.addEventListener('change', () => noteEdited(nt));
    setTimeout(() => bo.focus({preventScroll:true}), 60);
    return;
  }
  if (n.type==='issue'){
    const i = n.data;
    $('#fName').textContent = `Issue #${i.iid}`;
    $('#fSub').textContent = i.short;
    status.className = 'badge ok'; status.innerHTML = '<span class="d"></span>Aberta';
    $('#fInput').placeholder = `Comentar na issue #${i.iid}`;
    $('#fSugg').innerHTML = `<button type="button" data-act="quick" data-iid="${i.iid}">Iniciar agentes</button><button type="button" data-act="note-for" data-nid="${n.id}">+ Nota para esta issue</button>`;
  } else {
    const m = n.data;
    $('#fName').textContent = `MR !${m.iid}`;
    $('#fSub').textContent = `${m.repo} · ${m.branch}`;
    { const t = document.createElement('div'); t.innerHTML = mrBadge(m); status.className = t.firstChild.className; status.innerHTML = t.firstChild.innerHTML; }
    $('#fInput').placeholder = `Comentar no MR !${m.iid}`;
    $('#fSugg').innerHTML = `<button type="button" data-act="review" data-nid="${n.id}">Pedir revisão a um agente</button><button type="button" data-act="focus-node" data-nid="${m.agent.node.id}">Abrir ${m.agent.name}</button>`;
  }
  fb.innerHTML = docHTML(n);
}
function refreshDoc(){
  if (!F.n || F.n.type==='term' || F.n.type==='note') return;
  const fb = $('#fBody'), y = fb.scrollTop;
  fillDoc(F.n); fb.scrollTop = y;
}


/* ---------- sidebar ---------- */
function log(msg){
  feedItems.unshift({t:now(), msg}); feedItems.length = Math.min(feedItems.length, 40);
  if (S.tab==='feed') renderSide();
}
function updateStats(){
  const act = liveAgents().filter(a=>['running','coordinating'].includes(a.status)).length, wait = liveAgents().filter(a=>a.status==='waiting').length;
  const mrs = S.nodes.filter(n=>n.type==='mr').length;
  $('#stats').innerHTML = `<span class="badge info live"><span class="d"></span>${act} ativos</span>`
    + (wait ? `<button class="badge warn badge-btn" data-act="goto-actions" title="Ver ações pendentes"><span class="d"></span>${wait} aguardando você</button>` : '')
    + `<span class="badge mrb">${mrs} MRs</span>`;
  refreshActions();
}
function renderSide(){
  const q = $('#q').value.toLowerCase(), box = $('#sideb');
  $('#searchW').hidden = S.tab==='feed' || S.tab==='actions';
  $('#chips').hidden = S.tab!=='issues';
  if (S.tab==='issues'){
    const activeOf = i => liveAgents().filter(a => a.issue===i && !['done','stopped'].includes(a.status));
    const pass = i => S.filter==='bug' ? i.labels.includes('bug') : S.filter==='agents' ? activeOf(i).length > 0 : true;
    const list = ISSUES.filter(i => (!q || (i.title+' '+i.iid+' '+i.labels.join(' ')).toLowerCase().includes(q)) && pass(i));
    const row = i => {
      const on = !!issueNodeOf(i), act = activeOf(i), waiting = act.some(a => a.status==='waiting');
      const repos = [...new Set(i.tasks.map(t=>t.repo))];
      const state = !on ? '' : waiting ? '<span class="badge warn" title="Algum agente aguarda você"><span class="d"></span>Você</span>'
        : act.length ? `<span class="badge info live" title="${act.length} agentes ativos"><span class="d"></span>${act.length}</span>` : '';
      return `<div class="iss" draggable="true" data-drag-src="issue:${i.iid}">
        <span class="iss-ic ${i.labels.includes('bug')?'bug':''}">${ICON.issue}</span>
        <div class="iss-b"><div class="iss-t">${esc(i.title)}</div>
          <div class="iss-m"><span class="num">#${i.iid}</span>${i.labels.includes('P1')?'<span class="badge bad">P1</span>':''}<span class="iss-repo">${repos[0]}${repos.length>1?` +${repos.length-1}`:''}</span></div></div>
        <div class="iss-r">${state}<button class="btn plain icon xs" data-act="add-issue" data-iid="${i.iid}" aria-label="${on?'Mostrar':'Adicionar'} issue #${i.iid} ${on?'no':'ao'} canvas" title="${on?'Mostrar no canvas':'Adicionar ao canvas'}">${on ? ICON.locate : ICON.plus}</button></div>
      </div>`;
    };
    const on = list.filter(i => issueNodeOf(i)), off = list.filter(i => !issueNodeOf(i));
    box.innerHTML = (on.length ? `<div class="grp-h"><span>No canvas</span><span class="cnt">${on.length}</span></div>${on.map(row).join('')}` : '')
      + `<div class="grp-h"><span>Backlog</span><span class="cnt">${off.length}</span></div>`
      + (off.map(row).join('') || `<p class="tip">${list.length ? 'Todas estas issues já estão no canvas.' : 'Nenhuma issue com esse filtro.'}</p>`)
      + `<p class="tip">${ICON.drag} Arraste para o canvas, ou solte em cima de um agente para dar contexto.</p>`;
  } else if (S.tab==='actions'){
    box.innerHTML = actionsHTML();
  } else if (S.tab==='repos'){
    const list = REPOS.filter(r => !q || r.id.includes(q));
    box.innerHTML = `<div class="grp-h"><span>Repositórios</span><span class="cnt">${list.length}</span></div>` + list.map(r => {
      const act = liveAgents().filter(a => a.repo===r.id && !['done','stopped'].includes(a.status)).length;
      return `<div class="iss" draggable="true" data-drag-src="repo:${r.id}">
        <span class="iss-ic repo">${ICON.repo}</span>
        <div class="iss-b"><div class="iss-t mono-t">${r.id}</div><div class="iss-m"><span>${esc(r.desc)}</span></div></div>
        <div class="iss-r">${act ? `<span class="badge info live" title="${act} agentes ativos"><span class="d"></span>${act}</span>` : ''}<button class="btn plain icon xs" data-act="new-agent" data-repo="${r.id}" aria-label="Novo agente em ${r.id}" title="Novo agente">${ICON.agent}</button></div>
      </div>`;
    }).join('') + `<p class="tip">${ICON.drag} Solte um repositório em cima de um agente para ele ler esse código também.</p>`;
  } else {
    box.innerHTML = feedItems.length ? `<ol class="tl">${feedItems.map(f => `<li><span class="tl-dot"></span><div><p>${esc(f.msg)}</p><time>${f.t}</time></div></li>`).join('')}</ol>`
      : '<p class="tip">Nada aconteceu ainda.</p>';
  }
}
function setTab(t){
  S.tab = t;
  const tabs = [...document.querySelectorAll('.seg button')];
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab===t));
  $('#segInd').style.transform = `translateX(${tabs.findIndex(b => b.dataset.tab===t)*100}%)`;
  renderSide();
}
function addIssue(iid, at){
  const i = issueBy(iid), ex = issueNodeOf(i);
  if (ex){ focusNode(ex); return ex; }
  const c = at || viewCenter();
  const pos = freeSpot([{x:c.x-142, y:c.y-70}], 284, 160);
  const n = addNode('issue', pos.x, pos.y, i);
  log(`Issue #${iid} adicionada ao canvas`);
  renderSide(); select(n.id);
  return n;
}
function focusNode(n){
  select(n.id);
  const k = S.view.k, r = rect(n), A = safeArea();
  glideTo({ k, x:A.x + A.w/2 - (r.x + r.w/2)*k, y:A.y + Math.min(A.h/2, (A.h - r.h*k)/2 + r.h*k/2) - (r.y + r.h/2)*k }, 300);
}

/* ---------- inspetor ---------- */
function select(id){
  if (S.sel){ const o = nodeBy(S.sel); o && o.el.classList.remove('sel'); }
  S.sel = id; if (id) S.panel = null;
  if (id) nodeBy(id).el.classList.add('sel');
  renderInspector();
}
const statusShort = s => ({idle:'Pronto', running:'Trabalhando', waiting:'Aguardando', coordinating:'Coordenando', done:'Concluído', paused:'Pausado', stopped:'Parado'}[s]);
function treeOf(a){
  const kids = a.children.filter(c => !c.removed);
  return `<li><button data-act="focus" data-nid="${a.node.id}" class="${S.sel===a.node.id?'cur':''}">
    <span class="sd ${a.status}"></span><span class="nm">${a.name}</span>
    <span class="badge ${statusTone(a.status)}">${statusShort(a.status)}</span>
    <span class="mt">${esc(roleLabel(a))}${a.blank ? ' · sem instrução' : a.role!=='orch' ? ' · '+a.repo : ` · ${a.tasks.length} repos`}</span></button>
    ${kids.length?`<ul>${kids.map(treeOf).join('')}</ul>`:''}</li>`;
}
const subtree = a => [a, ...a.children.filter(c => !c.removed).flatMap(subtree)];
const ctxIcon = c => c.startsWith('repo ') ? ICON.repo : c.startsWith('issue') ? ICON.issue : c.startsWith('nota: ') ? ICON.note : ICON_DOC;
function currentStep(a){
  for (let j = Math.min(a.step, a.script.length) - 1; j >= 0; j--){ const s = a.script[j]; if (s[0]==='tool') return `${s[1]}(${s[2]})`; }
  return 'Preparando o contexto';
}
// detalhes do agente: usados no painel lateral e no modo foco
function agentDetails(a, inFocus){
  const live = !['done','stopped'].includes(a.status);
  const team = subtree(a).slice(1);
  const waiting = subtree(a).filter(x => x.status==='waiting');
  const workers = a.children.filter(c => c.role==='main' && !c.removed);
  const mrs = subtree(a).filter(x => x.mr).length;
  const sub = a.issue ? `Issue #${a.issue.iid} · ${esc(a.issue.short)}` : esc(a.title || 'Agente solo');
  const canSpawn = !a.blank && a.role!=='orch' && a.role!=='review' && a.depth < a.maxDepth;

  const ctl = a.status==='running' ? `<button class="btn" data-act="pause" data-aid="${a.id}">Pausar</button>`
    : a.status==='paused' ? `<button class="btn" data-act="resume" data-aid="${a.id}">Retomar</button>` : '';
  const stop = live ? `<button class="btn danger" data-act="stop" data-aid="${a.id}">Parar</button>` : '';

  const callout = waiting.length ? `<div class="callout"><span>${waiting.length===1 && waiting[0]===a ? 'Este agente está aguardando sua permissão.'
      : `${waiting.length} agente${waiting.length>1?'s aguardam':' aguarda'} sua permissão.`}</span>
      <button class="btn sm" data-act="focus-open" data-aid="${waiting[0].id}">Revisar</button></div>` : '';

  let progress;
  if (a.blank){
    progress = `<div class="callout info"><span>${a.ctx.some(c => c.startsWith('repo ') || c.startsWith('issue')) ? 'Contexto pronto. Envie a primeira instrução pela janela do agente.' : 'Adicione um repositório ou uma issue ao contexto e envie a primeira instrução.'}</span></div>`;
  } else if (a.role==='orch'){
    const done = workers.filter(w => w.status==='done').length;
    progress = `<div class="prog"><div class="prog-meta"><span>Plano</span><span><b>${done} de ${a.tasks.length}</b> repositórios</span></div>
      <div class="segs">${a.tasks.map((t,j) => `<i class="${workers[j] ? workers[j].status : ''}" title="${t.repo}"></i>`).join('')}</div></div>`;
  } else {
    const pct = Math.min(1, a.step / a.script.length);
    progress = `<div class="prog"><div class="prog-meta"><span>Progresso</span><span><b>${Math.round(pct*100)}%</b></span></div>
      <div class="bar ${a.status==='done'?'done':''}"><i style="transform:scaleX(${pct.toFixed(3)})"></i></div>
      ${live ? `<div class="now">${esc(currentStep(a))}</div>` : ''}</div>`;
  }
  const stats = a.role==='orch'
    ? [[workers.length,'Agentes'],[mrs,'MRs'],[fmtK(subtree(a).reduce((t, x) => t + (x.tokens||0), 0)),'Tokens']]
    : [[a.blank ? '—' : `${Math.min(a.step,a.script.length)}/${a.script.length}`,'Etapas'],[fmtK(a.tokens||0),'Tokens'],[a.mr ? '!'+a.mr.iid : '—','MR']];

  const repos = a.blank ? a.ctx.filter(c => c.startsWith('repo ')).map(c => c.slice(5)) : a.role==='orch' ? a.tasks.map(t=>t.repo) : [a.repo];
  const issueN = a.issue && issueNodeOf(a.issue);
  const hasTeam = rootOf(a).children.some(c => !c.removed);
  const spawnBtn = canSpawn ? `<button class="btn sm plain" data-act="sub" data-aid="${a.id}">+ Sub-agente</button>` : '';

  return `${inFocus ? '' : `<div class="ag-head"><div class="ag-title"><h3>${a.name}</h3><span class="badge ${statusTone(a.status)}"><span class="d"></span>${statusLabel(a.status)}</span></div>
      <p class="ag-sub">${esc(roleLabel(a))} · ${sub}</p></div>
    <div class="ag-actions">${F.a===a ? `<button class="btn" data-act="focus-close">Sair do foco</button>` : `<button class="btn primary" data-act="focus-open" data-aid="${a.id}">Abrir em foco</button>`}${ctl}${stop}</div>`}
    ${inFocus && (ctl || stop) ? `<div class="ag-actions">${ctl}${stop}</div>` : ''}
    ${callout}
    ${progress}
    <div class="stats3">${stats.map(([v,l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    ${hasTeam ? `<div class="grp"><div class="sec-h"><h4>Equipe</h4>${spawnBtn}</div><ul class="tree">${treeOf(rootOf(a))}</ul></div>`
      : canSpawn ? `<div class="grp"><div class="sec-h"><h4>Equipe</h4>${spawnBtn}</div><p class="lab" style="margin:0">Sem sub-agentes. Pode criar até ${a.maxDepth-a.depth} nível${a.maxDepth-a.depth>1?'s':''}.</p></div>` : ''}
    ${ctxSectionHTML(a)}
    ${timelineHTML(a)}
    <div class="grp"><h4>Detalhes</h4><dl class="kv">
      <dt>Repositório${repos.length>1?'s':''}</dt><dd><span class="tags">${repos.map(r=>`<span class="badge repo">${r}</span>`).join('')}</span></dd>
      ${a.role!=='orch' && !a.blank ? `<dt>Branch</dt><dd class="mono">${esc(a.branch)}</dd>` : ''}
      ${a.issue ? `<dt>Issue</dt><dd>${issueN ? `<button class="btn sm" data-act="focus" data-nid="${issueN.id}">#${a.issue.iid}</button>` : '#'+a.issue.iid}</dd>` : ''}
      ${a.mr ? `<dt>MR</dt><dd><button class="btn sm" data-act="focus" data-nid="${a.mr.node.id}">!${a.mr.iid}</button> <span class="lab">${a.mr.pipeline==='passed'?'pipeline passou':'pipeline rodando'}</span></dd>` : ''}
      ${a.parent ? `<dt>Criado por</dt><dd>${a.parent.name}</dd>` : ''}
    </dl>${!a.mr && a.role==='main' && !a.blank ? `<div><button class="btn sm" data-act="mr-now" data-aid="${a.id}">Abrir MR agora</button></div>` : ''}</div>
    ${a.role==='orch' ? '<p class="lab" style="margin:0">Mensagens para o orquestrador são repassadas a todos os agentes dele.</p>' : ''}

/* ---------- ações ---------- */
document.addEventListener('change', e => {
  if ((e.target.id === 'ctx-add' || e.target.id === 'ctx-add-f') && e.target.value){
    const a = agents.find(x => x.id===e.target.dataset.aid), v = e.target.value;
    if (v.startsWith('note:')) linkNote(noteById(v.slice(5)), a.node); else addContext(a, v);
  }
  if (e.target.dataset && e.target.dataset.auto){ const r = AUTOS.find(x => x.id===e.target.dataset.auto); r.on = e.target.checked; log(`Automação "${r.when}" ${r.on ? 'ligada' : 'desligada'}`); }
  if (e.target.id === 'note-link' && e.target.value) linkNote(noteById(e.target.dataset.note), nodeBy(e.target.value));
});
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab){ setTab(tab.dataset.tab); return; }
  const chip = e.target.closest('[data-filter]');
  if (chip){ S.filter = chip.dataset.filter; document.querySelectorAll('[data-filter]').forEach(c => c.setAttribute('aria-pressed', c===chip)); renderSide(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, a = b.dataset.aid && agents.find(x => x.id===b.dataset.aid);
  const n = b.dataset.nid && nodeBy(b.dataset.nid);
  if (act==='add-issue'){ addIssue(+b.dataset.iid); closeSide(); }
  else if (act==='focus' && n){ if (F.n) openFocusNode(n); else focusNode(n); }
  else if (act==='focus-node' && n) openFocusNode(n);
  else if (act==='focus-open' && a) openFocus(a);
  else if (act==='focus-close') closeFocus(true);
  else if (act==='suggest' && F.a) tell(F.a, b.textContent);
  else if (act==='ctx-remove' && a){ removeCtx(a, b.dataset.c); if (CP.a===a) renderCP(); }
  else if (act==='ctx-pick' && a) openCP(a, b);
  else if (act==='ctx-sum' && a) summarizeCtx(a, b.dataset.c);
  else if (act==='ctx-add-sug' && a){ const c = b.dataset.c, nt = c.startsWith('nota: ') && activeNotes(notes).find(x => noteLabel(x)===c); if (nt) linkNote(nt, a.node); else addContext(a, c); renderInspector(); }
  else if (act==='goto-actions'){ setTab('actions'); if (innerWidth <= 860) $('#side').classList.add('open'); else if ($('.main').classList.contains('side-hidden')) toggleSide(true); }
  else if (act==='allow-always' && a){
    const k = cmdKey(a.askCmd || ''); if (k && !POLICIES.includes(k)) POLICIES.push(k);
    log(`Regra criada: sempre permitir "${k}"`);
    liveAgents().filter(x => x.status==='waiting' && allowedByPolicy(x.askCmd || '')).forEach(x => fire('approve', { aid:x.id }));
    renderSide(); if (S.panel==='auto') renderInspector();
  }
  else if (act==='approve-all'){ liveAgents().filter(x => x.status==='waiting').forEach(x => fire('approve', { aid:x.id })); log('Todas as permissões pendentes foram aprovadas'); }
  else if (act==='policy-rm'){ const i = POLICIES.indexOf(b.dataset.c); if (i >= 0) POLICIES.splice(i, 1); renderSide(); if (S.panel==='auto') renderInspector(); }
  else if (act==='merge' && n){
    const m = n.data; m.merged = true; m.thread.push({ who:'você', t:'agora', text:'Aprovado e mergeado.' });
    renderNode(n); log(`MR !${m.iid} aprovado e mergeado`); if (F.n===n) refreshDoc(); updateStats(); if (S.sel===n.id) renderInspector();
  }
  else if (act==='fix-pipe' && n) createFixAgent(n);
  else if (act==='auto'){ select(null); S.panel = 'auto'; renderInspector(); }
  else if (act==='sim-pipe') simPipe();
  else if (act==='sim-review') simReview();
  else if (act==='sim-label') simLabel();
  else if (act==='remove' && n) removeNode(n, true);
  else if (act==='close'){ select(null); S.panel = null; renderInspector(); }
  else if (act==='help'){ select(null); S.panel = 'help'; renderInspector(); }
  else if (act==='new-agent'){ const ag = newBlankAgent(null, b.dataset.repo); closeSide(); setTimeout(() => ag.node.el.querySelector('.composer input')?.focus({preventScroll:true}), 300); }
  else if (act==='new-solo'){ select(null); S.soloRepo = b.dataset.repo || null; S.panel = 'solo'; renderInspector(); closeSide(); }
  else if (act==='new-note') newNoteAt();
  else if (act==='note-for' && n){ const r = rect(n), inFocus = !!F.n, nt = newNoteAt({x:r.x+r.w+60+135, y:r.y+90}, n); if (inFocus) openFocusNode(nt.node); }
  else if (act==='unlink' && n) unlinkNote(noteById(b.dataset.note), n);
  else if (act==='quick'){
    const iN = issueNodeOf(issueBy(+b.dataset.iid));
    launchIssue(iN, { repos:iN.data.tasks.map(t=>t.repo), ctx:['issue #'+iN.data.iid,'comentários','CLAUDE.md'], maxDepth:2, notes:activeNotes(iN.data.notes) });
    select(iN.id);
  }
  else if (act==='start'){
    const i = n.data, repos = REPOS.map(r=>r.id).filter(id => $('#c-r-'+id).checked);
    if (!repos.length) return;
    const ctx = [];
    if ($('#c-desc').checked) ctx.push('issue #'+i.iid); if ($('#c-com').checked) ctx.push('comentários');
    if ($('#c-md').checked) ctx.push('CLAUDE.md'); if ($('#c-pipe').checked) ctx.push('log do pipeline');
    launchIssue(n, { repos, ctx, extra:$('#c-extra').value.trim(), maxDepth:+$('#c-depth').value, notes:i.notes.filter(nt => $('#c-note-'+nt.id)?.checked) });
    renderInspector();
  }
  else if (act==='start-solo'){
    const prompt = $('#s-prompt').value.trim(); if (!prompt) return;
    const repos = REPOS.map(r=>r.id).filter(id => $('#s-r-'+id).checked); if (!repos.length) return;
    const ctx = ['instrução do usuário'];
    if ($('#s-md').checked) ctx.push('CLAUDE.md'); if ($('#s-readme').checked) ctx.push('README e docs/'); if ($('#s-open').checked) ctx.push('issues abertas');
    const tasks = repos.map(r => genTask(r, prompt)), title = prompt.length>60 ? prompt.slice(0,58)+'…' : prompt;
    const common = { title, extra:prompt, maxDepth:+$('#s-depth').value, openMr:$('#s-mr').checked };
    const r = repos.length>1 ? startRoot({ ...common, role:'orch', tasks, ctx:[...ctx, ...repos.map(x=>'repo '+x)] })
                             : startRoot({ ...common, task:tasks[0], repo:repos[0], ctx:[...ctx, 'repo '+repos[0]] });
    focusNode(r.node); setTimeout(() => run(r), 300);
  }
  else if (act==='approve' && a && a.status==='waiting'){ a.askEl?.querySelector('.acts')?.remove(); line(a,'out','⎿ permitido por você'); setStatus(a,'running'); run(a); }
  else if (act==='deny' && a && a.status==='waiting'){ a.askEl?.querySelector('.acts')?.remove(); line(a,'out','⎿ negado'); a.script.splice(a.step,2,['txt','Ok, não vou rodar os testes localmente. Eles ficam para o CI.']); setStatus(a,'running'); run(a); }
  else if (act==='pause' && a){ clearTimeout(a.timer); setStatus(a,'paused'); line(a,'dim','— pausado por você —'); }
  else if (act==='resume' && a){ setStatus(a,'running'); run(a); }
  else if (act==='stop' && a){ clearTimeout(a.timer); setStatus(a,'stopped'); line(a,'dim','— parado por você —'); log(`${a.name} parado`); }
  else if (act==='sub' && a){ spawnSub(a); renderInspector(); }
  else if (act==='mr-now' && a){ openMR(a); renderInspector(); }
  else if (act==='review' && n){
    const m = n.data, r = createAgent({ issue:m.issue, role:'review', mr:m, task:m.task, repo:m.repo, branch:m.branch, depth:9, ctx:['diff do !'+m.iid, 'repo '+m.repo, 'CLAUDE.md'] });
    const mr_ = rect(n); addTermNode(r, [{x:mr_.x+mr_.w+40,y:mr_.y-20},{x:mr_.x,y:mr_.y+mr_.h+60}], n, 'spawn');
    log(`${r.name} revisando !${m.iid}`); updateStats(); setTimeout(()=>run(r),300); renderInspector();
  }
});
function launchIssue(iN, {repos, ctx, extra, maxDepth, notes = []}){
  const i = iN.data;
  const tasks = repos.map(r => i.tasks.find(t=>t.repo===r) || genTask(r, i.short));
  const a = repos.length > 1
    ? startRoot({ issue:i, role:'orch', tasks, ctx:[...ctx], extra, maxDepth, notes }, iN)
    : startRoot({ issue:i, task:tasks[0], repo:repos[0], ctx:[...ctx, 'repo '+repos[0]], extra, maxDepth, notes }, iN);
  setTimeout(() => run(a), 300);
  return a;
}

let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (e.button === 2) return;   // botão direito abre o menu de atalhos
  if (e.target.closest('.toolbar,.insp,.focus,.toast')) return;
  stopGlide();
  const nodeEl = e.target.closest('.node');
  if (e.target.closest('[data-port]')){
    const n = nodeBy(nodeEl.dataset.id); select(n.id);
    drag = {mode:'link', n, hover:null}; canvas.classList.add('linking'); canvas.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  if (e.target.closest('button,input,textarea,select,a,.tbody,form')){ if (nodeEl && S.sel!==nodeEl.dataset.id) select(nodeEl.dataset.id); return; }
  if (nodeEl){
    const n = nodeBy(nodeEl.dataset.id); select(n.id);
    if (e.target.closest('[data-drag]')) drag = {mode:'node', n, px:e.clientX, py:e.clientY, sx:n.x, sy:n.y, moved:false, bar:!!e.target.closest('.wbar')};
  } else {
    drag = {mode:'pan', px:e.clientX, py:e.clientY, sx:S.view.x, sy:S.view.y, moved:false}; canvas.classList.add('panning');
  }
  if (drag) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
  if (drag.mode==='link'){
    const r = canvas.getBoundingClientRect(), v = S.view, px = (e.clientX-r.left-v.x)/v.k, py = (e.clientY-r.top-v.y)/v.k;
    const A = rect(drag.n), x1 = A.x+A.w+13, y1 = A.y+A.h/2, m = Math.max(40, Math.abs(px-x1)/2);
    $('#tmpEdge').setAttribute('d', `M${x1},${y1} C${x1+m},${y1} ${px-m},${py} ${px},${py}`);
    const hitEl = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node'), hit = hitEl && nodeBy(hitEl.dataset.id);
    const ok = hit && ['term','issue'].includes(hit.type) ? hitEl : null;
    if (ok !== drag.hover){ drag.hover && drag.hover.classList.remove('linkt'); drag.hover = ok; ok && ok.classList.add('linkt'); }
  }
  else if (drag.mode==='pan'){ if (Math.abs(dx)+Math.abs(dy)>3) drag.moved = true; S.view.x = drag.sx + dx; S.view.y = drag.sy + dy; applyView(); }

  openCM(e, el ? nodeBy(el.dataset.id) : null);
});
$('#cmenu').addEventListener('pointermove', e => { const b = e.target.closest('.cm-it'); if (b && +b.dataset.i !== CM.idx) cmActive(+b.dataset.i); });
$('#cmenu').addEventListener('pointerleave', () => cmActive(-1));
$('#cmenu').addEventListener('click', e => { const b = e.target.closest('.cm-it'); if (b) cmRun(+b.dataset.i); });
$('#cmenu').addEventListener('contextmenu', e => e.preventDefault());
$('#cmenu').addEventListener('keydown', e => {
  const idxs = CM.items.map((it, i) => it.run ? i : -1).filter(i => i >= 0);
  if (e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    const p = idxs.indexOf(CM.idx), d = e.key==='ArrowDown' ? 1 : -1;
    cmActive(idxs[p < 0 ? (d > 0 ? 0 : idxs.length - 1) : (p + d + idxs.length) % idxs.length]);
  } else if (e.key==='Enter' || e.key===' '){ e.preventDefault(); if (CM.idx >= 0) cmRun(CM.idx); }
  else if (e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeCM(); }
});
document.addEventListener('pointerdown', e => { if (CM.open && !e.target.closest('#cmenu')) closeCM(); }, true);
canvas.addEventListener('wheel', closeCM, { passive:true });
addEventListener('resize', closeCM);
addEventListener('blur', closeCM);

/* ---------- qualidade do contexto: medidor, resumo, sugestões ---------- */
const CTX_BUDGET = 60000;
const fmtK = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace('.0','') + 'k' : String(n);
const ev = (a, k, label) => (a.events || (a.events = [])).push({ t:Date.now(), k, label });
function ctxTokens(c){
  if (c.startsWith('resumo: ')) return 1800;
  if (c.startsWith('repo ')) return 8200;
  if (c.startsWith('issue #')){ const i = issueBy(+c.slice(7)); return i ? 1200 + i.desc.length + i.thread.length*380 : 2000; }
  if (c.startsWith('nota: ')){ const nt = activeNotes(notes).find(x => noteLabel(x)===c); return nt ? Math.max(150, Math.round((nt.title.length + nt.body.length)/3.6)) : 400; }
  if (c.startsWith('arquivo ')) return 2600;
  if (c.startsWith('plano de')) return 1500;
  if (c.startsWith('diff do')) return 5200;
  return { 'comentários':2600, 'CLAUDE.md':3200, 'README e docs/':9400, 'docs/arquitetura.md':6100, 'log do último pipeline':24800, 'log do pipeline':24800, 'instrução do usuário':300, 'issues abertas':7200 }[c] ?? 1200;
}
const ctxKind = c => c.startsWith('repo ') ? 'repo' : c.startsWith('issue') ? 'issue' : c.startsWith('nota: ') ? 'note' : c.startsWith('resumo: ') ? 'sum' : 'other';
const ctxTotal = a => a.ctx.reduce((s, c) => s + ctxTokens(c), 0);
function summarizeCtx(a, c){
  const before = ctxTokens(c), lbl = 'resumo: ' + c;
  a.ctx = a.ctx.map(x => x===c ? lbl : x);
  line(a,'tool',`<span class="g">●</span> <b>Resumir</b>(${esc(c)})`);
  line(a,'out',`⎿ ${fmtK(before)} → ${fmtK(ctxTokens(lbl))} tokens`);
  log(`"${c}" resumido para ${a.name} (−${fmtK(before - ctxTokens(lbl))} tokens)`);
  renderInspector();
}
function ctxSuggestions(a){
  const out = [], has = c => a.ctx.includes(c) || a.ctx.includes('resumo: ' + c);
  const push = (label, why) => { if (!has(label) && !out.some(o => o.label===label) && out.length < 4) out.push({ label, why }); };
  const iss = a.issue || a.ctx.map(c => c.match(/^issue #(\d+)/)).filter(Boolean).map(m => issueBy(+m[1]))[0];
  if (iss) activeNotes(iss.notes).forEach(nt => push(noteLabel(nt), `Nota ligada à issue #${iss.iid}`));
  const repos = a.role==='orch' ? a.tasks.map(t => t.repo) : (!a.blank && a.repo) ? [a.repo] : a.ctx.filter(c => c.startsWith('repo ')).map(c => c.slice(5));
  const files = a.task ? a.task.files : repos.flatMap(r => (repoBy(r)?.sample || []).slice(0,1));
  files.slice(0,2).forEach(f => push('arquivo ' + f, 'Arquivo citado na tarefa'));
  push('CLAUDE.md', 'Convenções do repositório');
  ISSUES.filter(i => i!==iss && i.tasks.some(t => repos.includes(t.repo))).slice(0,1)
    .forEach(i => push('issue #' + i.iid, `Também mexe em ${i.tasks.find(t => repos.includes(t.repo)).repo}`));
  if (a.role==='orch') push('docs/arquitetura.md', 'Visão geral entre repositórios');
  return out;
}
function ctxSectionHTML(a){
  const total = ctxTotal(a), over = total > CTX_BUDGET, sugg = ctxSuggestions(a);
  const heavy = c => ctxTokens(c) >= 8000 && !c.startsWith('repo ') && !c.startsWith('resumo: ');
  const short = c => c.replace(/^repo /,'').replace(/^nota: /,'').replace(/^arquivo /,'');
  return `<div class="grp"><div class="sec-h"><h4>Contexto</h4>
      <button type="button" class="btn sm" data-act="ctx-pick" data-aid="${a.id}" aria-haspopup="dialog">${ICON.plus} Adicionar</button></div>
    <div class="meter ${over ? 'over' : ''}"><div class="meter-top"><span><b>${fmtK(total)}</b> tokens</span><span>recomendado até ${fmtK(CTX_BUDGET)}</span></div>
      <div class="stack" role="img" aria-label="${fmtK(total)} de ${fmtK(CTX_BUDGET)} tokens recomendados">${a.ctx.map(c => `<i class="k-${ctxKind(c)}" style="flex-grow:${ctxTokens(c)}" title="${esc(short(c))} · ${fmtK(ctxTokens(c))}"></i>`).join('')}<i class="k-free" style="flex-grow:${Math.max(0, CTX_BUDGET - total)}"></i></div></div>
    ${over ? '<div class="callout"><span>Contexto acima do recomendado. Resuma os itens maiores para o agente focar no que importa.</span></div>' : ''}
    ${a.ctx.length ? '' : '<p class="ctx-empty">Nenhum contexto ainda.</p>'}
    <div class="tags">${a.ctx.map(c => {
      const sum = c.startsWith('resumo: '), base = sum ? c.slice(8) : c;
      return `<span class="chipx ${sum ? 'sum' : ''}">${ctxIcon(base)}${esc(short(base))}${sum ? '<em>resumo</em>' : ''}<span class="tk">${fmtK(ctxTokens(c))}</span>${heavy(c) ? `<button class="mini" data-act="ctx-sum" data-aid="${a.id}" data-c="${esc(c)}">Resumir</button>` : ''}<button class="x" data-act="ctx-remove" data-aid="${a.id}" data-c="${esc(c)}" aria-label="Remover ${esc(base)} do contexto">✕</button></span>`;
    }).join('')}</div>
    ${sugg.length ? `<div class="sugg"><span class="lab">Sugeridos para esta tarefa</span>${sugg.map(s => `<button type="button" class="chip-s" data-act="ctx-add-sug" data-aid="${a.id}" data-c="${esc(s.label)}" title="${esc(s.why)}">${ICON.plus}${esc(short(s.label))}<span class="tk">${fmtK(ctxTokens(s.label))}</span></button>`).join('')}</div>` : ''}
  </div>`;
}
const ago = t => { const s = Math.max(1, Math.round((Date.now() - t)/1000)); return s < 60 ? `há ${s}s` : `há ${Math.floor(s/60)} min`; };
function timelineHTML(a){
  if (!a.events || !a.events.length) return '';
  return `<div class="grp"><h4>Linha do tempo</h4><ol class="tl tl-ag">${a.events.slice(-8).reverse().map(e => `<li><span class="tl-dot k-${e.k}"></span><div><p>${esc(e.label)}</p><time>${ago(e.t)}</time></div></li>`).join('')}</ol></div>`;
}

/* ---------- nota de passagem ---------- */
function createHandoff(a){
  if (a.removed || !S.nodes.includes(a.node)) return;
  const r = rect(a.node);
  const kids = a.role==='orch' ? a.children.filter(c => c.task && !c.removed) : [a];
  const decisions = kids.map(c => '• ' + (a.role==='orch' ? c.repo + ': ' : '') + c.task.finding);
  const files = kids.flatMap(c => c.task.files.slice(0,2).map(f => '• ' + (a.role==='orch' ? c.repo + '/' : '') + f));
  const mrs = subtree(a).filter(x => x.mr).map(x => `!${x.mr.iid} (${x.repo})`);
  const body = `Decisões\n${decisions.join('\n')}\n\nArquivos tocados\n${files.join('\n')}\n\nMRs: ${mrs.join(', ') || 'nenhum'}\nTestes: passaram\nPendências: revisar e mergear na ordem sugerida.`;
  const nt = createNote({ x:r.x + r.w + 60 + 135, y:r.y + 120 }, `Passagem · ${a.name}`, body);
  nt.handoff = true; renderNode(nt.node);
  link(a.node, nt.node, 'note');
  const iN = a.issue && issueNodeOf(a.issue);
  if (iN) linkNote(nt, iN);
  log(`${a.name} deixou uma nota de passagem${iN ? ' na issue #' + a.issue.iid : ''}`);
}

/* ---------- ações pendentes e regras de permissão ---------- */
const POLICIES = [];
const cmdKey = cmd => cmd.split(' ').slice(0,2).join(' ');
const allowedByPolicy = cmd => POLICIES.find(p => cmd.startsWith(p));
function mrBadge(m){
  return m.merged ? '<span class="badge mrb">Mergeado</span>'
    : m.pipeline==='failed' ? '<span class="badge bad"><span class="d"></span>Pipeline falhou</span>'
    : m.pipeline==='passed' ? '<span class="badge ok"><span class="d"></span>Pipeline passou</span>'
    : '<span class="badge info live"><span class="d"></span>Pipeline rodando</span>';
}
function pendingActions(){
  const mrs = S.nodes.filter(n => n.type==='mr');
  return {
    asks: liveAgents().filter(a => a.status==='waiting'),
    ready: mrs.filter(n => n.data.pipeline==='passed' && !n.data.merged),
    failed: mrs.filter(n => n.data.pipeline==='failed' && !(n.data.fixer && !n.data.fixer.removed)),
    idle: liveAgents().filter(a => a.status==='idle'),
  };
}
function policiesHTML(){
  return `<div class="grp-h"><span>Sempre permitidos</span><span class="cnt">${POLICIES.length}</span></div>` + (POLICIES.length
    ? `<div class="pol">${POLICIES.map(p => `<span class="chipx"><code>${esc(p)}</code><button class="x" data-act="policy-rm" data-c="${esc(p)}" aria-label="Remover regra ${esc(p)}">✕</button></span>`).join('')}</div>`
    : '<p class="tip">Use "Sempre permitir" num pedido para liberar aquele comando para todos os agentes.</p>');
}
function actionsHTML(){
  const p = pendingActions(), total = p.asks.length + p.ready.length + p.failed.length + p.idle.length;
  if (!total) return `<div class="empty-act"><span class="ico agent">${ICON.agent}</span><b>Nada esperando você</b><span>Quando um agente pedir permissão ou um MR ficar pronto, aparece aqui.</span></div>${policiesHTML()}`;
  const sec = (title, n, body, extra = '') => n ? `<div class="grp-h"><span>${title}</span><span class="cnt">${n}</span>${extra}</div>${body}` : '';
  return sec('Permissões', p.asks.length, p.asks.map(a => `<div class="act-card">
        <div class="act-top"><span class="sd waiting"></span><b>${a.name}</b><span class="lab">${a.role==='orch' ? 'orquestrador' : esc(a.repo || '')}</span>
          <button class="btn plain icon xs" data-act="focus-open" data-aid="${a.id}" aria-label="Abrir ${a.name}" title="Abrir agente" style="margin-left:auto">${ICON.expand}</button></div>
        <code class="act-cmd">${esc(a.askCmd || '')}</code>
        <div class="act-btns"><button class="btn sm primary" data-act="approve" data-aid="${a.id}">Permitir</button><button class="btn sm" data-act="deny" data-aid="${a.id}">Negar</button>
          <button class="btn sm plain" data-act="allow-always" data-aid="${a.id}" title="Libera este comando para todos os agentes">Sempre permitir</button></div></div>`).join(''),
      p.asks.length > 1 ? '<button class="btn sm plain" style="margin-left:auto" data-act="approve-all">Permitir todos</button>' : '')
    + sec('Merge requests prontos', p.ready.length, p.ready.map(n => `<div class="act-card">
        <div class="act-top"><span class="ico mr sm">${ICON.mr}</span><b>!${n.data.iid}</b><span class="lab">${n.data.repo}</span></div>
        <p class="act-t">${esc(n.data.title)}</p>
        <div class="act-btns"><button class="btn sm primary" data-act="merge" data-nid="${n.id}">Aprovar e mergear</button><button class="btn sm" data-act="focus-node" data-nid="${n.id}">Ver diff</button></div></div>`).join(''))
    + sec('Pipelines com falha', p.failed.length, p.failed.map(n => `<div class="act-card">
        <div class="act-top"><span class="ico mr sm">${ICON.mr}</span><b>!${n.data.iid}</b><span class="lab">${n.data.repo}</span><span class="badge bad" style="margin-left:auto">Falhou</span></div>
        <div class="act-btns"><button class="btn sm primary" data-act="fix-pipe" data-nid="${n.id}">Criar agente para corrigir</button><button class="btn sm" data-act="focus-node" data-nid="${n.id}">Ver</button></div></div>`).join(''))
    + sec('Aguardando instrução', p.idle.length, p.idle.map(a => `<div class="act-card">
        <div class="act-top"><span class="sd idle"></span><b>${a.name}</b><span class="lab">${a.ctx.length} itens de contexto</span></div>
        <div class="act-btns"><button class="btn sm" data-act="focus-open" data-aid="${a.id}">Escrever instrução</button></div></div>`).join(''))
    + policiesHTML();
}
function refreshActions(){
  const p = pendingActions(), n = p.asks.length + p.ready.length + p.failed.length + p.idle.length, c = $('#tab-actions .cnt');
  c.textContent = n; c.hidden = !n;
  if (S.tab==='actions') renderSide();
}

/* ---------- automações ---------- */
const AUTOS = [
  { id:'pipe-fail', on:true, when:'Pipeline falhou', then:'Criar agente para corrigir', desc:'Lê o log do job e corrige no mesmo branch.' },
  { id:'review-comment', on:true, when:'Comentário de revisão no MR', then:'Enviar ao agente autor', desc:'O agente que abriu o MR ajusta e responde.' },
  { id:'auto-review', on:false, when:'MR aberto por agente', then:'Pedir revisão automática', desc:'Um agente revisor comenta antes de você olhar.' },
  { id:'handoff', on:true, when:'Agente concluiu', then:'Escrever nota de passagem', desc:'Decisões e arquivos viram contexto para os próximos agentes.' },
  { id:'label-ready', on:false, when:'Label agent-ready na issue', then:'Iniciar agentes', desc:'A issue entra no canvas e os agentes começam sozinhos.' },
];
const auto = id => AUTOS.find(x => x.id===id).on;
function autosHTML(){
  return `<h3>Quando acontecer…</h3><p class="desc" style="color:var(--muted);margin:0">Regras que reagem a eventos do GitLab e colocam agentes para trabalhar.</p>
    <div class="rules">${AUTOS.map(r => `<label class="rule" for="auto-${r.id}"><span class="rule-tx"><span class="rule-when">${r.when}</span><span class="rule-then">→ ${r.then}</span><span class="lab">${r.desc}</span></span>
      <span class="switch"><input type="checkbox" id="auto-${r.id}" data-auto="${r.id}" ${r.on ? 'checked' : ''}><i></i></span></label>`).join('')}</div>
    <div class="grp"><h4>Testar com um evento</h4><div class="row2">
      <button class="btn" data-act="sim-pipe">Simular pipeline falhando</button>
      <button class="btn" data-act="sim-review">Simular comentário de revisão</button>
      <button class="btn" data-act="sim-label">Simular label agent-ready</button></div>
      <p class="lab" style="margin:0">Usa o MR mais recente do canvas, ou a próxima issue do backlog.</p></div>
    <div class="grp"><h4>Permissões</h4>${POLICIES.length ? `<div class="tags">${POLICIES.map(p => `<span class="chipx"><code>${esc(p)}</code><button class="x" data-act="policy-rm" data-c="${esc(p)}" aria-label="Remover regra ${esc(p)}">✕</button></span>`).join('')}</div>` : '<p class="lab" style="margin:0">Nenhum comando liberado de vez. Crie regras pela aba Ações.</p>'}</div>`;
}
const latestMR = () => [...S.nodes].reverse().find(n => n.type==='mr' && !n.data.merged);
const notice = msg => showToast(msg, { label:'Ok', fn:() => {} });
function createFixAgent(n){
  const m = n.data;
  if (m.fixer && !m.fixer.removed && !['done','stopped'].includes(m.fixer.status)){ focusNode(m.fixer.node); return; }
  const f = createAgent({ issue:m.issue, role:'fix', mr:m, task:m.task, repo:m.repo, branch:m.branch, depth:9, title:'Corrigir pipeline de !' + m.iid,
    ctx:['log do último pipeline', 'diff do !' + m.iid, 'repo ' + m.repo, 'CLAUDE.md'] });
  m.fixer = f;
  const r = rect(n);
  addTermNode(f, [{ x:r.x + r.w + 40, y:r.y - 20 }, { x:r.x, y:r.y + r.h + 60 }], n, 'spawn');
  log(`${f.name} criado para corrigir o pipeline de !${m.iid}`);
  updateStats(); setTimeout(() => run(f), 300);
}
function simPipe(){
  const n = latestMR(); if (!n){ notice('Nenhum MR aberto no canvas para simular.'); return; }
  const m = n.data; m.pipeline = 'failed'; renderNode(n);
  log(`Pipeline do !${m.iid} falhou no job de testes`);
  if (F.n===n) refreshDoc();
  if (auto('pipe-fail')) createFixAgent(n); else { updateStats(); notice(`Pipeline do !${m.iid} falhou. Veja na aba Ações.`); }
}
function simReview(){
  const n = latestMR(); if (!n){ notice('Nenhum MR aberto no canvas para simular.'); return; }
  const m = n.data, text = 'Faltou tratar o caso de lista vazia.';
  m.thread.push({ who:'joao.p', t:'agora', text });
  log(`joao.p comentou no MR !${m.iid}`);
  if (F.n===n) refreshDoc();
  if (auto('review-comment') && !m.agent.removed) tell(m.agent, `Comentário de revisão no !${m.iid} (joao.p): ${text}`);
}
function simLabel(){
  const i = ISSUES.find(x => !issueNodeOf(x)); if (!i){ notice('Todas as issues já estão no canvas.'); return; }
  const n = addIssue(i.iid);
  log(`Label agent-ready adicionada na issue #${i.iid}`);
  if (auto('label-ready')) launchIssue(n, { repos:[...new Set(i.tasks.map(t => t.repo))], ctx:['issue #' + i.iid, 'comentários', 'CLAUDE.md'], maxDepth:2, notes:activeNotes(i.notes) });
  else notice(`Issue #${i.iid} trazida. Ligue a regra "Label agent-ready" para iniciar sozinha.`);
}

/* ---------- cena inicial de exemplo ---------- */
function boot(){
  S.quiet = true;   // a cena inicial aparece pronta, sem animação de entrada
  setTab('issues');
  log('Canvas aberto com dados de exemplo');
  const i142 = addNode('issue', 40, 40, issueBy(142));
  const i157 = addNode('issue', 1180, 40, issueBy(157));
  const solo = createAgent({ title:'Gerar client TypeScript a partir do openapi.yaml', extra:'Gerar client TypeScript a partir do openapi.yaml', task:genTask('shared-contracts','client TypeScript openapi'), repo:'shared-contracts', ctx:['instrução do usuário','CLAUDE.md','repo shared-contracts'] });
  addTermNode(solo, [{x:40, y:1060}]);
  runInstant(solo);
  const a1 = startRoot({ issue:i142.data, task:i142.data.tasks[0], repo:'payments-api', ctx:['issue #142','comentários','CLAUDE.md','repo payments-api'] }, i142);
  const nt = createNote({x:1180+284+80+135, y:40+100}, 'Decisões de produto',
    'CSV com separador ; para abrir certo no Excel BR\nPDF usa o logo novo (assets/brand/logo-2026.svg)\nDatas no formato dd/mm/aaaa\nNão incluir transações estornadas');
  linkNote(nt, i157);
  const o = startRoot({ issue:i157.data, role:'orch', tasks:i157.data.tasks, ctx:['issue #157','comentários','CLAUDE.md'], notes:i157.data.notes }, i157);
  linkNote(nt, o.node);
  renderSide(); updateStats(); renderInspector();
  requestAnimationFrame(() => { fit(); drawEdges(); S.quiet = false; });
  setTimeout(() => run(a1), 600);
  setTimeout(() => run(o), 1100);
  addEventListener('resize', () => { drawEdges(); layoutFocus(); });
}
applyView();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(boot);
})();
</script>
